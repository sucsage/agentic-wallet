<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MilestonePay Desktop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Same look as the MilestonePay website (web/src/components/mockup.css, v08 theme): dark only. */
:root {
  --bg: #101010; --side: #050505; --panel: #171717; --panel-2: #111111; --ink: #f5f6fa; --muted: #9da9ba; --dim: #8e8e93;
  --line: #343434; --line-2: #292929; --field: #0c0c0c; --field-line: #333333; --chip: #202020;
  --accent: #927cff; --accent-2: #8b69f6; --blue: #559bff; --user: #1a2635;
  --ok: #89ef82; --ok-bg: #12230f; --bad: #ff656e; --bad-bg: #2a1214; --warn: #f3ed21; --warn-bg: #24220c;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); }
body { margin: 0; font: 14px/1.5 Inter, "IBM Plex Sans Thai", system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; border: 1px solid var(--field-line); background: transparent; color: var(--ink); border-radius: 8px; padding: 8px 14px; font-size: 13px; font-weight: 600; transition: filter .15s, background .15s, border-color .15s; white-space: nowrap; }
button:hover { border-color: #555; background: #1a1a1a; }
button.primary { background: #fff; color: #111; border-color: #fff; }
button.primary:hover { filter: brightness(.88); background: #fff; }
button.danger { color: var(--bad); border-color: #5a2a2e; }
button.danger:hover { border-color: var(--bad); background: transparent; }
button:disabled { opacity: .5; cursor: default; filter: none; }
input, textarea, select { width: 100%; border: 1px solid var(--field-line); border-radius: 10px; padding: 9px 12px; background: var(--field); font-size: 13px; outline: none; }
input:focus, textarea:focus, select:focus { border-color: #6657a9; box-shadow: 0 0 0 3px #927cff22; }
input[type=checkbox] { accent-color: var(--accent); }
label { display: block; font-weight: 500; font-size: 12px; color: #c9ced6; margin: 12px 0 5px; }
a { color: var(--blue); }
.hint { color: var(--muted); font-size: 12px; }
.mono { font-family: var(--mono); font-size: 12px; word-break: break-all; }
.center { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: #000; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 17px; padding: 18px; }
.narrow { width: min(420px, 100%); background: var(--panel-2); border-color: var(--line-2); border-radius: 20px; padding: 24px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; letter-spacing: -.01em; }
.mark { width: 0; height: 0; border-left: 9px solid transparent; border-right: 9px solid transparent; border-bottom: 17px solid var(--accent); filter: drop-shadow(0 2px 2px #5d3ee6); flex: none; }
.tag { font-size: 10px; font-weight: 600; color: #c9b9ff; border: 1px solid #3b3166; background: #1a1530; border-radius: 99px; padding: 2px 8px; }
.tabs { display: flex; gap: 4px; margin: 16px 0 4px; padding: 4px; background: #0a0a0a; border: 1px solid var(--line-2); border-radius: 12px; }
.tabs button { flex: 1; border: 0; border-radius: 9px; padding: 8px 6px; font-weight: 500; color: var(--dim); }
.tabs button.on { background: #262626; color: #fff; }
.err { background: var(--bad-bg); color: var(--bad); border: 1px solid #5a2a2e; border-radius: 10px; padding: 8px 10px; margin-top: 12px; display: none; font-size: 13px; }
.ok-box { background: var(--ok-bg); color: var(--ok); border: 1px solid #2c4a27; border-radius: 10px; padding: 8px 10px; font-size: 13px; }
.layout { display: grid; grid-template-columns: 196px 1fr; min-height: 100vh; }
nav { background: var(--side); padding: 14px 8px 10px; display: flex; flex-direction: column; gap: 2px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
nav .brand { margin: 2px 8px 14px; font-size: 15px; }
nav .group { color: #777; font-size: 9px; letter-spacing: .08em; text-transform: uppercase; margin: 12px 8px 5px; }
nav button { border: 0; border-left: 2px solid transparent; text-align: left; background: transparent; height: 32px; padding: 0 9px; border-radius: 8px; color: var(--dim); font-size: 12px; font-weight: 500; }
nav button:hover { background: #191919; color: #e6e6e8; }
nav button.on { background: #191919; color: #e6e6e8; border-left-color: var(--accent); font-weight: 700; padding-left: 7px; }
nav .foot { margin-top: auto; padding: 6px; border: 1px solid var(--line-2); border-radius: 9px; display: flex; align-items: center; gap: 8px; }
nav .avatar { width: 24px; height: 24px; border-radius: 50%; background: #fff; color: #111; display: grid; place-items: center; font-size: 9px; font-weight: 700; flex: none; }
nav .who { display: flex; flex-direction: column; min-width: 0; line-height: 1.3; flex: 1; }
nav .who b { font-size: 11px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
nav .who small { font-size: 10px; color: #85858a; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
nav .foot button { height: 26px; padding: 0 8px; font-size: 11px; border: 1px solid var(--line-2); border-left-width: 1px; }
main { padding: 26px 28px 50px; max-width: 1180px; width: 100%; }
h1 { font-size: 24px; letter-spacing: -.02em; margin: 0 0 16px; }
h2 { font-size: 15px; margin: 0 0 10px; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 13px; margin-bottom: 14px; }
.stat .v { font-size: 26px; font-weight: 700; letter-spacing: -.02em; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid #383838; border-radius: 20px; padding: 3px 10px; color: #c6d0de; font-size: 11px; white-space: nowrap; }
.chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--blue); }
.chip.ok { color: var(--ok); } .chip.ok::before { background: var(--ok); }
.chip.bad { color: var(--bad); } .chip.bad::before { background: var(--bad); }
.chip.warn { color: var(--warn); } .chip.warn::before { background: var(--warn); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.space { justify-content: space-between; }
.deal { margin-bottom: 12px; }
.ms { border-top: 1px solid var(--line-2); padding: 11px 0; display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 9px 6px; border-bottom: 1px solid var(--line-2); vertical-align: top; font-size: 13px; }
th { color: var(--muted); font-weight: 500; font-size: 11px; }
.banner { background: #1a1530; border: 1px solid #3b3166; color: #d9cfff; border-radius: 17px; padding: 14px 16px; margin-bottom: 14px; }
.banner .req { background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-top: 8px; }
.check { display: grid; grid-template-columns: 24px 1fr; gap: 8px; padding: 10px 0; border-bottom: 1px solid var(--line-2); }
dialog { border: 1px solid var(--line); border-radius: 20px; background: var(--panel-2); color: var(--ink); width: min(460px, 92vw); padding: 22px; }
dialog::backdrop { background: rgba(0,0,0,.6); backdrop-filter: blur(2px); }
.spin { width: 16px; height: 16px; border-radius: 50%; border: 2px solid #3a3a3a; border-top-color: var(--accent); display: inline-block; animation: spin .8s linear infinite; flex: none; }
button .spin { width: 13px; height: 13px; border-width: 2px; border-color: #bbb; border-top-color: #111; margin-right: 7px; vertical-align: -2px; }
@keyframes spin { to { transform: rotate(360deg); } }
.loading { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; }
.accounts { display: flex; flex-direction: column; gap: 6px; margin: 14px 0 4px; }
.acct { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 9px 10px; border: 1px solid var(--line-2); border-radius: 12px; background: #0c0c0c; font-weight: 500; }
.acct:hover { border-color: #4a4a4a; background: #121212; }
.acct.on { border-color: #6657a9; background: #1a1530; }
.acct .avatar { width: 30px; height: 30px; border-radius: 50%; background: #fff; color: #111; display: grid; place-items: center; font-size: 11px; font-weight: 700; flex: none; }
.acct .who { display: flex; flex-direction: column; min-width: 0; line-height: 1.3; }
.acct .who b { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.acct .who small { font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.linkbtn { border: 0; background: none; padding: 0; color: var(--blue); font-weight: 500; font-size: 12.5px; }
.linkbtn:hover { background: none; text-decoration: underline; }
.demo { font-size: 11px; color: #c9b9ff; margin-top: 14px; text-align: center; }
.msgs { display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
.msg { max-width: 78%; padding: 12px 14px; border-radius: 17px; white-space: pre-wrap; word-break: break-word; font-size: 13.5px; }
.msg.user { align-self: flex-end; background: var(--user); border: 1px solid #253447; }
.msg.assistant { align-self: flex-start; background: var(--panel); border: 1px solid var(--line); white-space: normal; color: #e3e6ed; }
.msg .tools { margin-top: 8px; display: flex; gap: 4px; flex-wrap: wrap; }
.md > :first-child { margin-top: 0; } .md > :last-child { margin-bottom: 0; }
.md p, .md ul, .md ol, .md pre, .md blockquote, .md table { margin: 6px 0; }
.md ul, .md ol { padding-left: 20px; } .md h3, .md h4, .md h5, .md h6 { margin: 10px 0 4px; font-size: 14px; }
.md code { font-family: var(--mono); font-size: 12px; background: #262626; padding: 1px 5px; border-radius: 5px; }
.md pre { background: #0c0c0c; border: 1px solid var(--line-2); padding: 10px; border-radius: 10px; overflow-x: auto; } .md pre code { background: none; padding: 0; }
.md blockquote { border-left: 3px solid var(--line); padding-left: 10px; color: var(--muted); }
.md table { border-collapse: collapse; font-size: 12.5px; display: block; overflow-x: auto; } .md th, .md td { border: 1px solid var(--line); padding: 5px 9px; }
.md a { color: var(--blue); } .md hr { border: 0; border-top: 1px solid var(--line); }
.composer { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: end; position: sticky; bottom: 0; background: var(--bg); padding: 10px 0; }
.composer textarea { resize: vertical; min-height: 46px; max-height: 200px; border-radius: 13px; }
.issue { font-size: 12px; padding: 5px 9px; border-radius: 9px; margin-top: 5px; }
.issue.block { background: var(--bad-bg); color: var(--bad); } .issue.warn { background: var(--warn-bg); color: var(--warn); }
.in { color: var(--ok); } .out { color: var(--bad); }
/* AI chat: the website's layout (saved chats · conversation · agent rail). */
main.wide { max-width: none; padding: 20px 22px 24px; }
.chat-layout { display: grid; grid-template-columns: 230px minmax(0,1fr) 290px; gap: 14px; align-items: start; }
.chats-panel, .convo, .rail { border: 1px solid #333; border-radius: 16px; background: #111; }
.chats-panel { padding: 14px; position: sticky; top: 20px; }
.chats-panel header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.chats-panel header b { font-size: 15px; } .chats-panel header span { padding: 2px 10px; background: #252525; border-radius: 16px; font-size: 11px; color: #999; }
.chats-panel > button { width: 100%; margin-bottom: 8px; }
.chat-list > div { display: flex; align-items: center; gap: 4px; padding: 8px 9px; border-radius: 10px; }
.chat-list > div.on { background: #222; }
.chat-list button { border: 0; background: transparent; padding: 0; text-align: left; color: #aaa; font-weight: 500; white-space: normal; }
.chat-list button:first-child { flex: 1; min-width: 0; } .chat-list button:hover { background: transparent; color: #fff; }
.chat-list b { display: block; font-size: 13px; font-weight: 500; overflow-wrap: anywhere; line-height: 1.4; } .chat-list small { display: block; font-size: 11px; color: #777; }
.chat-list button.del { flex: none; width: 22px; color: #777; } .chat-list button.del:hover { color: var(--bad); }
.chats-panel > p { font-size: 11px; color: #777; margin: 12px 0 0; }
.convo { display: flex; flex-direction: column; gap: 12px; padding: 20px; height: calc(100vh - 44px); min-height: 460px; overflow: hidden; }
.convo-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; flex-wrap: wrap; padding-bottom: 12px; border-bottom: 1px solid #303030; flex: none; }
.convo-head > div { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.convo-head h1 { font-size: 16px; margin: 0; }
.online { display: flex; align-items: center; gap: 7px; color: #999; font-size: 12px; } .online i { width: 7px; height: 7px; border-radius: 50%; background: #17c96b; }
.pill { padding: 3px 10px; border-radius: 20px; background: #211d3d; color: #9a7cff; font-size: 11px; }
.convo-msgs { flex: 1 1 0; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding-right: 8px; scrollbar-width: thin; scrollbar-color: #454545 transparent; }
.convo-msgs > * { flex-shrink: 0; }
.a-meta, .u-msg > small { color: #777; font-size: 11px; }
.a-msg { width: min(100%, 680px); padding: 14px 16px; border: 1px solid #303030; border-radius: 16px; background: #191919; color: #e4e4e4; font-size: 14px; line-height: 1.6; }
.a-msg.wide { width: 100%; }
.a-msg > p { margin: 0 0 10px; }
.sugg { display: flex; flex-wrap: wrap; gap: 8px; }
.sugg button { border: 1px solid #333; border-radius: 18px; color: #aaa; font-size: 12px; font-weight: 500; padding: 6px 12px; white-space: normal; text-align: left; }
.sugg button:hover { color: #fff; border-color: #666; background: transparent; }
.u-msg { width: min(84%, 560px); align-self: flex-end; display: flex; flex-direction: column; gap: 6px; margin: 8px 0; text-align: right; }
.u-msg p { margin: 0; padding: 13px 16px; border-radius: 16px; background: #222; text-align: left; color: #eee; font-size: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
.badges { display: flex; flex-wrap: wrap; gap: 6px; }
.badges span { padding: 3px 9px; border-radius: 18px; background: #0c2a1d; color: #16d777; font-size: 11px; font-weight: 600; }
.badges span:nth-child(2n) { background: #30240b; color: #f1a900; }
.steps-live { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: #9fc2ff; animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .45; } }
.usage-line { margin-top: 10px; padding-top: 8px; border-top: 1px solid #2a2a2a; color: #888; font-size: 11px; display: flex; gap: 10px; flex-wrap: wrap; }
.a-msg .card.deal { background: #121212; margin: 10px 0 0; }
.composer2 { position: relative; display: flex; align-items: flex-end; gap: 10px; padding: 10px 12px 26px; border: 1px solid #333; border-radius: 14px; background: #0b0b0b; flex: none; }
.composer2 > button, .composer2 > label { width: 32px; height: 32px; flex: none; border: 0; border-radius: 8px; background: #1b1b1b; color: #eee; font-size: 18px; padding: 0; display: grid; place-items: center; margin: 0; cursor: pointer; }
.composer2 > button[type=submit] { background: #3984f7; font-weight: 700; }
.composer2 textarea { flex: 1; min-width: 0; border: 0; background: transparent; box-shadow: none; resize: none; padding: 6px 2px; font-size: 14px; max-height: 160px; }
.composer2 textarea:focus { box-shadow: none; }
.composer2 > small { position: absolute; left: 56px; bottom: 7px; color: #666; font-size: 10px; }
.attached { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #ccc; flex: none; }
.rail { padding: 16px; position: sticky; top: 20px; max-height: calc(100vh - 44px); overflow-y: auto; }
.rail h3 { font-size: 13px; margin: 0 0 8px; } .rail section + section { margin-top: 14px; padding-top: 14px; border-top: 1px solid #2a2a2a; }
.rail .kv { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; padding: 3px 0; } .rail .kv span:first-child { color: #aaa; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tier { display: grid; grid-template-columns: 52px 1fr; gap: 8px; font-size: 12px; padding: 3px 0; color: #ccc; }
.tier b { font-size: 11px; color: #9a7cff; }
.bar { height: 6px; border-radius: 99px; background: var(--chip); overflow: hidden; margin: 3px 0 6px; } .bar i { display: block; height: 100%; }
.switch { display: flex; align-items: flex-start; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line-2); margin: 0; font-size: 13px; color: var(--ink); cursor: pointer; }
.switch input { width: 16px; height: 16px; margin-top: 2px; flex: none; }
@media (max-width: 1180px) { .chat-layout { grid-template-columns: 210px minmax(0,1fr); } .rail { grid-column: 1 / -1; position: static; max-height: none; } }
@media (max-width: 760px) { .chat-layout { grid-template-columns: 1fr; } .chats-panel { position: static; } .convo { height: 75vh; } }
@media (max-width: 760px) {
  .layout { grid-template-columns: 1fr; }
  nav { flex-direction: row; overflow-x: auto; height: auto; position: static; padding: 8px; gap: 4px; }
  nav .brand, nav .group, nav .foot { display: none; }
  nav button { white-space: nowrap; flex: none; border-left: 0; }
  nav button.on { border-left: 0; padding-left: 9px; }
  main { padding: 16px 14px 36px; }
  .msg { max-width: 94%; }
}
</style>

<div id="root"><div class="center"><div class="loading"><span class="spin"></span>Opening MilestonePay…</div></div></div>
<dialog id="dlg"><form method="dialog" id="dlg-form"></form></dialog>
<script>/*MARKDOWN*/</script>
<script>
"use strict";
// The token from the URL the app opened (#t=...): every call to the local app carries it.
(function () {
  const m = location.hash.match(/t=([\w-]+)/);
  if (m) { try { sessionStorage.setItem("awt", m[1]); } catch {} history.replaceState(null, "", "/"); }
})();
const TOKEN = (() => { try { return sessionStorage.getItem("awt") || ""; } catch { return ""; } })();
const $ = (s, el = document) => el.querySelector(s);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const short = (h) => (h ? `${h.slice(0, 10)}…${h.slice(-6)}` : "");
const money = (n, cur) => `${Number(n).toLocaleString(undefined, { maximumFractionDigits: 2 })} ${cur || ""}`.trim();
const when = (t) => (t ? new Date(t).toLocaleString() : "");

async function api(path, method = "GET", body) {
  const r = await fetch(path, { method, headers: { "x-app-token": TOKEN, "content-type": "application/json" }, body: body === undefined ? undefined : JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || `Error ${r.status}`);
  return j;
}

const S = { lang: (() => { try { return localStorage.getItem("awlang") || "th"; } catch { return "th"; } })(), info: null, view: "overview", account: null, deals: null, chain: null, verify: null, busy: false };

function showErr(el, e) { el.textContent = e.message || String(e); el.style.display = "block"; }

async function boot() {
  if (!TOKEN) { $("#root").innerHTML = `<div class="center"><div class="card narrow"><div class="brand"><span class="mark"></span>MilestonePay</div><p>Open the app from the link it printed in its window (it carries a private token).</p></div></div>`; return; }
  S.info = await api("/app/state");
  render();
}

function render() {
  const st = S.info.stage;
  if (st === "setup") return renderSetup();
  if (st === "locked") return renderUnlock();
  if (st === "onboarding") return renderOnboarding();
  renderApp();
}

// ---------------------------------------------------------------- setup / restore / unlock
const initials = (name) => (name || "?").split(/\s+/).filter(Boolean).map((w) => w[0]).join("").slice(0, 2).toUpperCase();
const host = (u) => { try { return new URL(u).host; } catch { return u || ""; } };
const busy = (btn, text) => { btn.disabled = true; btn.dataset.label = btn.textContent; btn.innerHTML = `<span class="spin"></span>${esc(text)}`; };
const idle = (btn) => { btn.disabled = false; btn.textContent = btn.dataset.label || btn.textContent; };
function loadingScreen(text) { $("#root").innerHTML = `<div class="center"><div class="loading"><span class="spin"></span>${esc(text)}</div></div>`; }

function renderSetup(tab = "login") {
  const hasAccounts = (S.info.accounts || []).length > 0;
  const TABS = [["login", "Sign in"], ["signup", "Create account"], ["link", "Link with code"], ["restore", "Restore"]];
  const serverField = `<label>Server</label><input name="server" value="${esc(S.info.defaultServer)}" />`;
  const pass = `<label>App passphrase</label><input name="passphrase" type="password" minlength="8" required />
        <div class="hint">Encrypts this computer's key. It never leaves the computer; nobody can reset it.</div>
        <label>App passphrase again</label><input name="again" type="password" required />`;
  const computer = `<label>Name of this computer</label><input name="deviceName" value="${esc(S.info.hostname)}" />`;
  const body = {
    login: `${serverField}<label>Email</label><input name="email" type="email" autocomplete="username" required /><label>Password</label><input name="password" type="password" autocomplete="current-password" required />${computer}${pass}`,
    signup: `${serverField}<p class="hint" style="margin:12px 0 0">New accounts are made on the MilestonePay website: sign up, verify your identity with the digital ID, and your wallet opens. Then come back here and <b>Sign in</b> with the same email and password.</p>`,

  }[tab];
  const label = { login: "Sign in", signup: "Open sign-up on the website", link: "Link this computer", restore: "Restore" }[tab];

    <div class="demo">Demo · test money · no real funds</div>

  const tl = $("#tologin"); if (tl) tl.onclick = () => renderSetup("login");
  $("#f").onsubmit = async (ev) => {
    ev.preventDefault();

      if (tab === "signup") {

        idle(go);

  const verified = st.identity === "VERIFIED" || st.account;
  $("#root").innerHTML = `<div class="center"><div class="card narrow">
    <div class="brand"><span class="mark"></span>Welcome, ${esc(d.user)}</div>

      <div class="hint">${verified ? "Verified · your wallet account is open." : st.identity === "PENDING" ? "Waiting for a reviewer." : "With your national digital ID (mock ThaID for Thailand, mock 国家网络身份认证 for China). It opens in your browser."}</div>
      ${st.lastCheck && !verified && st.lastCheck !== "ok" ? `<div class="issue block">${esc(st.lastCheck)}</div>` : ""}
      ${verified ? "" : `<div class="row" style="margin-top:8px"><select id="country" style="width:auto"><option value="TH">Thailand · ThaID</option><option value="CN">China · 网号</option></select><button class="primary" id="kyc">Verify in my browser</button></div>`}</div></div>
    <div class="check"><div>${st.wallet ? "✅" : "2"}</div><div><b>Create my wallet</b><div class="hint">Your agent wallet on the chain and your own deal chain on this computer (about 10 seconds).</div>
      ${verified ? `<button class="primary" id="fin" style="margin-top:8px">Create my wallet</button>` : ""}</div></div>
    <div class="err" id="e"></div>
    <div class="row space" style="margin-top:12px"><span class="hint">This page checks every few seconds.</span><button id="lock">Lock</button></div>
  </div></div>`;
  $("#lock").onclick = async () => { clearInterval(onboardTimer); S.info = await api("/app/lock", "POST"); render(); };
  const k = $("#kyc"); if (k) k.onclick = async () => { k.disabled = true; try { await api("/app/kyc-start", "POST", { country: $("#country").value }); k.textContent = "Finish in your browser…"; } catch (e) { showErr($("#e"), e); k.disabled = false; } };
  const fin = $("#fin"); if (fin) fin.onclick = async () => { fin.disabled = true; fin.textContent = "Creating…"; try { await api("/app/setup-finish", "POST"); clearInterval(onboardTimer); S.info = await api("/app/state"); render(); load(); } catch (e) { showErr($("#e"), e); fin.disabled = false; fin.textContent = "Create my wallet"; } };
  clearInterval(onboardTimer);
  if (!verified) onboardTimer = setInterval(async () => { try { const n = await api("/app/onboarding"); if (n.identity === "VERIFIED" || n.account || n.lastCheck !== st.lastCheck) { clearInterval(onboardTimer); renderOnboarding(); } } catch {} }, 4000);
}

function renderUnlock() {
  const accounts = S.info.accounts || [];
  const cur = S.info.current;
  const d = S.info.device;
  $("#root").innerHTML = `<div class="center"><div class="card narrow">
    <div class="brand"><span class="mark"></span>MilestonePay <span class="tag">Desktop</span></div>
    <div class="accounts">${accounts.map((a) => `<button type="button" class="acct ${a.id === cur ? "on" : ""}" data-acct="${esc(a.id)}"><span class="avatar">${esc(initials(a.user))}</span><span class="who"><b>${esc(a.user)}</b><small>${esc(a.deviceName)} · ${esc(host(a.server))}</small></span></button>`).join("")}</div>
    <form id="f"><label>App passphrase${accounts.length > 1 && d ? ` for ${esc(d.user)}` : ""}</label><input name="p" type="password" autofocus required />
    <div class="err" id="e"></div><div class="row space" style="margin-top:14px"><button class="primary" id="go">Unlock</button><button type="button" class="linkbtn" id="add">+ Add another account</button></div></form>
    <div class="demo">Demo · test money · no real funds</div></div></div>`;
  document.querySelectorAll("[data-acct]").forEach((b) => (b.onclick = async () => {
    if (b.dataset.acct === S.info.current) return;
    try { S.info = await api("/app/select-account", "POST", { id: b.dataset.acct }); renderUnlock(); } catch (e) { showErr($("#e"), e); }
  }));
  $("#add").onclick = () => renderSetup("login");
  $("#f").onsubmit = async (ev) => {
    ev.preventDefault();
    const go = $("#go"), e = $("#e");
    e.style.display = "none";
    busy(go, "Unlocking…");
    try {
      S.info = await api("/app/unlock", "POST", { passphrase: new FormData(ev.target).get("p") });
      S.view = "overview";
      if (S.info.stage === "ready") { loadingScreen("Opening your wallet…"); await load(); } else render();
    } catch (err) { showErr(e, err); idle(go); }
  };
}

function renderApp() {
  const d = S.info.device;

  const label = Object.fromEntries(VIEWS);

  $("#root").innerHTML = `<div class="layout"><nav>
      <div class="brand"><span class="mark"></span>MilestonePay</div>
      ${groups.map(([g, ks]) => `<div class="group">${g}</div>${ks.map((k) => `<button data-v="${k}" class="${S.view === k ? "on" : ""}">${label[k]}</button>`).join("")}`).join("")}
      ${updateNudge()}<div class="foot"><div class="avatar">${esc(initials)}</div><div class="who"><b>${esc(d.user)}</b><small>${esc(d.name)}</small></div><button id="lock" title="Lock the app">Lock</button></div>

function agentBanner() {
  const ar = S.info.agentRequests || [];
  if (!ar.length) return "";
  const what = (r) => r.kind === "move" ? `${esc(r.action)} · deal D-${esc(r.dealId)}${["accept", "cancel"].includes(r.action) ? "" : ` milestone ${Number(r.index) + 1}`}` : r.kind === "confirm_draft" ? `confirm preview ${esc(r.draftId)}` : `${r.allowed ? "make payee" : "stop paying"} (contact ${esc(r.friendshipId)})`;
  return `<div class="banner"><b>Requests from AI agents</b> · they cannot sign; you decide
    ${ar.map((r) => `<div class="req row space"><div><b>${what(r)}</b><div class="hint">from ${esc(r.client)} · ${when(r.createdAt)}</div>${r.why ? `<div class="hint">“${esc(r.why)}”</div>` : ""}${r.reason ? `<div class="hint">reason: ${esc(r.reason)}</div>` : ""}</div>
      <div class="row"><button class="primary" data-asign="${esc(r.id)}">Sign</button><button data-areject="${esc(r.id)}">Reject</button></div></div>`).join("")}</div>`;
}

function requestsBanner() {
  const reqs = S.info.requests || [];
  if (!reqs.length) return agentBanner();
  return agentBanner() + `<div class="banner"><b>Waiting for your signature</b> · moves started on the website
    ${reqs.map((r) => `<div class="req row space"><div><b>${esc(r.action)}</b> · deal D-${esc(r.dealId)} · milestone ${Number(r.index) + 1}${r.reason ? `<div class="hint">${esc(r.reason)}</div>` : ""}<div class="hint">${when(r.createdAt)}</div></div>
      <div class="row"><button class="primary" data-sign="${esc(r.id)}">Sign</button><button data-reject="${esc(r.id)}">Reject</button></div></div>`).join("")}</div>`;
}

function syncLine() {
  const s = S.info.lastSync;
  const h = S.info.height;
  if (!s) return `<span class="chip">Not synced yet</span>`;
  return s.ok ? `<span class="chip ok">Synced ${new Date(s.at).toLocaleTimeString()}</span> <span class="hint">height ${h ?? "-"}</span>` : `<span class="chip bad" title="${esc(s.error)}">Sync failed</span> <span class="hint" style="max-width:360px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block;vertical-align:bottom">${esc(s.error)}</span>`;
}

/** What a deal asks in files (the Files filter): documents asked for, a PDF, a file I owe, a file to review. */
function dealFiles(d) {
  const files = (d.milestones || []).filter((m) => m.delivery === "file");
  const live = d.status === "Active";
  return {
    asks: files.length > 0,
    pdf: files.some((m) => (m.fileTypes || []).some((t) => /pdf/i.test(t))),
    todo: live && d.role === "seller" && files.some((m) => m.status === "Pending"),
    review: live && d.role === "buyer" && files.some((m) => m.status === "Delivered"),
  };
}
function dealsShown() {
  const q = (S.dealQ || "").trim().toLowerCase(), f = S.dealFile || "all";
  return (S.deals || []).filter((d) => (f === "all" || dealFiles(d)[f]) && (!q || [`d-${d.id}`, d.title, d.counterpartyLabel, d.counterparty, d.status].some((x) => String(x || "").toLowerCase().includes(q))));
}

function updateHtml() {
  const u = S.update;
  if (!u) return `<div class="loading"><span class="spin"></span>Checking for updates…</div>`;
  if (S.updating) return `<div class="loading"><span class="spin"></span>${esc(S.updating)}</div>`;
  return `<table><tr><th>This version</th><td>${esc(u.current)} <span class="hint">(${esc(u.platform)})</span></td></tr><tr><th>Latest release</th><td>${u.latest ? esc(u.latest) : "-"}${u.date ? ` <span class="hint">${new Date(u.date).toLocaleDateString()}</span>` : ""}</td></tr></table>
    ${u.available ? `<div class="banner" style="margin:10px 0 0"><b>Version ${esc(u.latest)} is out.</b>${u.notes ? `<div class="hint" style="white-space:pre-wrap;margin-top:4px">${esc(u.notes).slice(0, 600)}</div>` : ""}</div>` : u.latest ? `<p class="ok-box" style="margin:10px 0 0">You have the latest version.</p>` : ""}
    ${u.reason && u.available ? `<p class="hint">${esc(u.reason)}</p>` : u.reason && !u.latest ? `<p class="hint">${esc(u.reason)}</p>` : ""}
    <div class="row" style="margin-top:10px">${u.canInstall ? `<button class="primary" id="upd-go">Update to ${esc(u.latest)} and restart</button>` : ""}<button id="upd-check">Check now</button>${u.page ? `<a href="${esc(u.page)}" target="_blank" rel="noopener"><button>Release page</button></a>` : ""}</div>
    ${u.canInstall ? `<p class="hint">The new version is checked against its SHA-256 before it replaces this one. The app restarts and asks for your passphrase again.</p>` : ""}`;
}

function wireUpdate() {
  const c = $("#upd-check"); if (c) c.onclick = async () => { S.update = null; $("#upd").innerHTML = updateHtml(); S.update = await api("/app/update?force=1").catch((e) => ({ current: "?", reason: e.message })); renderView(); };
  const g = $("#upd-go"); if (g) g.onclick = async () => {
    if (!confirm(`Update MilestonePay to ${S.update.latest}? It restarts and asks for your passphrase again.`)) return;
    S.updating = "Downloading and checking the new version…"; $("#upd").innerHTML = updateHtml();
    try {
      const r = await api("/app/update", "POST");
      S.updating = `Restarting as version ${r.version}…`; $("#upd").innerHTML = updateHtml();
      // The new process takes over the same port and token; reload once it answers with the new version.
      for (let i = 0; i < 80; i++) {
        await new Promise((ok) => setTimeout(ok, 500));
        const p = await fetch("/ping").then((x) => x.json()).catch(() => null);
        if (p && p.version === r.version) { location.reload(); return; }
      }
      S.updating = null; toast("The app did not come back: open MilestonePay again"); renderView();
    } catch (e) { S.updating = null; toast(e.message); renderView(); }
  };
}

/** A line in the menu when a newer version is out (checked once per launch). */
function updateNudge() {
  const u = S.update;
  return u && u.available ? `<button data-v="settings" style="color:var(--accent);font-weight:700">⬆ Update to ${esc(u.latest)}</button>` : "";
}

    return `<div class="ms" style="grid-template-columns:1fr auto"><div><b>Group wallet</b><div class="hint">${x.myRole === "ADMIN" ? "Not opened yet. A group wallet hires and sells in the group's name; its money moves only after " + x.threshold + " signers approve." : "Not opened yet: the group's owner can open one."}</div></div>
      <div class="row">${x.myRole === "ADMIN" ? `<button class="primary" data-gwopen="${esc(x.id)}" data-name="${esc(x.name)}" data-th="${x.threshold}">Open a group wallet</button>` : ""}</div></div>`;
  }
  return `<div class="ms" style="grid-template-columns:1fr auto"><div><b>${w.kind === "GROUP" ? "Group" : "Company"} wallet</b> · <b>${money(w.balance, x.currency)}</b>
      <div class="hint">Account ${esc(w.accountNo || "-")} · payments and payouts need ${x.threshold} signers' votes</div></div>
    <div class="row"><button data-gwfund="${esc(w.companyId)}" data-name="${esc(x.name)}" data-cur="${esc(x.currency)}">Add money</button>${x.iSign ? `<button data-gwpay="${esc(x.id)}">Pay out to members</button>` : ""}</div></div>`;
}

function wireGroupWallets() {
  document.querySelectorAll("[data-gwopen]").forEach((b) => (b.onclick = async () => {
    if (!confirm(`Open a shared wallet for "${b.dataset.name}"? The group can then hire and sell in its own name; its money moves only after ${b.dataset.th} signers approve.`)) return;
    busy(b, "Opening (about 10 s)…");
    try { S.groups = await api("/app/groups", "POST", { op: "wallet", groupId: b.dataset.gwopen }); toast("Group wallet opened"); renderView(); } catch (e) { toast(e.message); idle(b); }
  }));
  document.querySelectorAll("[data-gwfund]").forEach((b) => (b.onclick = () => {
    const dlg = $("#dlg"), form = $("#dlg-form");
    form.innerHTML = `<h2>Add money to ${esc(b.dataset.name)}</h2><p class="hint">From your own wallet balance to the group's account (test money).</p>
      <label>Amount (${esc(b.dataset.cur)})</label><input name="amount" type="number" min="1" step="0.01" required><div class="err" id="fe"></div>
      <div class="row" style="justify-content:flex-end;margin-top:12px"><button value="cancel" formnovalidate>Cancel</button><button class="primary" id="fok" value="ok">Move money</button></div>`;
    const requestId = crypto.randomUUID();
    dlg.showModal();
    form.onsubmit = async (ev) => {
      if (ev.submitter?.value !== "ok") return;
      ev.preventDefault();
      const ok = $("#fok"); busy(ok, "Moving…");
      try { S.groups = await api("/app/groups", "POST", { op: "fund", companyId: b.dataset.gwfund, amount: Number(new FormData(form).get("amount")), requestId }); dlg.close(); toast("Added to the group wallet"); renderView(); }
      catch (e) { showErr($("#fe"), e); idle(ok); }
    };
  }));
  document.querySelectorAll("[data-gwpay]").forEach((b) => (b.onclick = () => {
    const g = S.groups.groups.find((x) => x.id === b.dataset.gwpay);
    const dlg = $("#dlg"), form = $("#dlg-form");
    form.innerHTML = `<h2>Pay out from ${esc(g.name)}</h2><p class="hint">Balance ${money(g.wallet.balance, g.currency)}. Everyone is paid together after ${g.threshold} signers approve (your proposal counts as your yes; votes are signed blocks).</p>
      ${g.members.map((mm) => `<div class="row" style="margin:6px 0"><span style="flex:1">${esc(mm.name)}</span><input name="a:${esc(mm.userId)}" type="number" min="0" step="0.01" placeholder="0" style="width:140px"></div>`).join("")}
      <div class="err" id="pe"></div>
      <div class="row" style="justify-content:flex-end;margin-top:12px"><button value="cancel" formnovalidate>Cancel</button><button class="primary" id="pok" value="ok">Propose the payout</button></div>`;
    dlg.showModal();
    form.onsubmit = async (ev) => {
      if (ev.submitter?.value !== "ok") return;
      ev.preventDefault();
      const recipients = [...new FormData(form).entries()].filter(([k, v]) => k.startsWith("a:") && Number(v) > 0).map(([k, v]) => ({ userId: k.slice(2), amount: Number(v) }));
      if (!recipients.length) { showErr($("#pe"), new Error("Enter an amount for at least one member")); return; }
      const ok = $("#pok"); busy(ok, "Proposing…");
      try { S.groups = await api("/app/groups", "POST", { op: "payout", groupId: g.id, recipients }); dlg.close(); toast("Payout proposed: waiting for the signers' votes"); renderView(); }
      catch (e) { showErr($("#pe"), e); idle(ok); }
    };
  }));
}

}

function blockText(b) {
  if (b.kind === "genesis") return `<b>Genesis</b> · wallet <span class="mono">${short(b.body.wallet)}</span>`;
  if (b.kind === "intent" && b.body.action === "vote") return `<b>You signed: ${b.body.approve ? "approve" : "reject"} a group payment</b> <span class="hint">proposal ${esc(b.body.proposalId)}</span>`;
  if (b.kind === "intent" && b.body.action === "payee") return `<b>You signed: ${b.body.allowed ? "make payee" : "stop paying"}</b> <span class="hint">contact ${esc(b.body.friendshipId)}</span>`;
  if (b.kind === "intent" && b.body.action === "confirm_draft") return `<b>You signed: confirm deal</b> <span class="hint">preview ${esc(b.body.draftId)}</span>`;
  if (b.kind === "intent" && b.body.action === "deliver") return `<b>You signed: deliver</b> · D-${esc(b.body.dealId)} milestone ${Number(b.body.index) + 1}${b.body.fileName ? `<div class="hint">${esc(b.body.fileName)} · sha256 ${esc(String(b.body.fileSha256 || "").slice(0, 12))}…</div>` : ""}${b.body.carrier ? `<div class="hint">${esc(b.body.carrier)} ${esc(b.body.tracking || "")}</div>` : ""}`;
  if (b.kind === "intent") return `<b>You signed: ${esc(b.body.action)}</b> · D-${esc(b.body.dealId)}${["cancel", "accept"].includes(b.body.action) ? "" : ` milestone ${Number(b.body.index) + 1}`}${b.body.requestId ? ` <span class="chip">from website</span>` : ""}${b.body.reason ? `<div class="hint">${esc(b.body.reason)}</div>` : ""}`;
  const e = b.body.event;
  return e.type === "deal" ? `<b>Deal D-${esc(e.dealId)}</b> → ${esc(e.status)} <span class="hint">total ${esc(e.data.total)}</span>` : `<b>D-${esc(e.dealId)} milestone ${Number(e.index) + 1}</b> → ${esc(e.status)} <span class="hint">${esc(e.data.amount)}</span>`;
}

  const tools = stepTools(x);
  const drafts = (x.steps || []).filter((st) => st && st.draft).map((st) => (S.drafts || []).find((d) => d.id === st.draft.id) || st.draft);
  const u = x.usage;
  return `<div class="a-meta">Agent · ${clock(x.at)}</div>
    ${tools.length ? `<div class="badges">${tools.map((t) => `<span title="${esc(TOOL_LABEL[t] || t)}">${esc(t)}</span>`).join("")}</div>` : ""}

}

function railHtml() {
  const h = S.chatHistory || [];
  const replies = h.filter((x) => x.role === "assistant");
  const chatTokens = replies.reduce((n, x) => n + ((x.usage && x.usage.tokens) || 0), 0);
  const calls = replies.reduce((n, x) => n + ((x.usage && x.usage.calls) || 0), 0);
  const counts = {};
  replies.forEach((x) => stepTools(x).forEach((t) => (counts[t] = (counts[t] || 0) + 1)));
  const tools = Object.entries(counts).sort((a, b) => b[1] - a[1]);
  const u = S.ai && S.ai.usage;
  const bar = (label, used, limit) => { const pct = limit > 0 ? Math.min(100, Math.round((used / limit) * 100)) : 100; return `<div class="kv"><span>${label}</span><span>${num(used)} / ${num(limit)}</span></div><div class="bar"><i style="width:${pct}%;background:${pct >= 100 ? "var(--bad)" : pct >= 80 ? "var(--warn)" : "var(--accent)"}"></i></div>`; };
  const today = new Date().toDateString();
  const mcpToday = S.mcp ? S.mcp.log.filter((c) => new Date(c.at).toDateString() === today) : [];
  const mcpTokens = mcpToday.reduce((n, c) => n + (c.tokens || 0), 0);
  const waiting = (S.drafts || []).filter((d) => ["PREVIEW", "DRAFT", "FAILED"].includes(d.status));
  return `<aside class="rail">
    <section><h3>Tokens</h3>${u ? `${bar("Today", u.today, u.perDay)}${bar("This week", u.week, u.perWeek)}${u.ownKeyToday ? `<div class="kv"><span>Your own key today</span><span>${num(u.ownKeyToday)}</span></div>` : ""}` : `<p class="hint">Loading…</p>`}
      <div class="kv"><span>This chat</span><span>${num(chatTokens)} tokens</span></div>
      <div class="kv"><span>Replies · model calls</span><span>${replies.length} · ${calls}</span></div>
      <button class="linkbtn" data-go="ai">AI settings (own key, instructions) →</button></section>
    <section><h3>Tools used in this chat</h3>${tools.length ? tools.map(([t, n]) => `<div class="kv"><span title="${esc(t)}">${esc(TOOL_LABEL[t] || t)}</span><span>×${n}</span></div>`).join("") : `<p class="hint" style="margin:0">None yet.</p>`}</section>
    <section><h3>MCP: outside agents</h3>${S.mcp ? `<div class="kv"><span>Server</span><span>${S.mcp.settings.enabled ? `<span class="chip ok">on</span>` : `<span class="chip bad">off</span>`}</span></div>
      <div class="kv"><span>Calls today</span><span>${mcpToday.length}</span></div><div class="kv"><span>Tokens today (ask_wallet_ai)</span><span>${num(mcpTokens)}</span></div>
      ${mcpToday.slice(0, 4).map((c) => `<div class="kv"><span>${esc(c.tool)} · ${esc(c.client)}</span><span class="hint">${clock(c.at)}</span></div>`).join("")}` : `<p class="hint">Loading…</p>`}
      <button class="linkbtn" data-go="mcp">Manage the MCP server →</button></section>
    <section><h3>What the agent can do</h3>${TIERS.map((t, i) => `<div class="tier"><b>Tier ${i}</b><span>${esc(t)}</span></div>`).join("")}</section>
    <section><h3>Previews waiting</h3>${waiting.length ? waiting.slice(0, 5).map((d) => `<div class="kv"><span title="${esc(d.title)}">${esc(d.title)}</span><button class="linkbtn" data-confirm="${esc(d.id)}">Confirm</button></div>`).join("") : `<p class="hint" style="margin:0">None.</p>`}</section>
  </aside>`;
}

function rememberChat(id) { S.chatId = id; try { id ? localStorage.setItem("awchat", id) : localStorage.removeItem("awchat"); } catch {} }

async function openChat(id) {
  rememberChat(id); S.chatLoading = true; S.chatHistory = []; renderView();
  try { S.chatHistory = (await api(`/app/chat?id=${encodeURIComponent(id)}`)).history; } catch (e) { toast(e.message); }
  S.chatLoading = false; renderView();
}

function wireChat() {
  $("#lang").value = S.lang || "th";
  $("#lang").onchange = (e) => { S.lang = e.target.value; try { localStorage.setItem("awlang", S.lang); } catch {} };
  $("#newchat").onclick = () => { rememberChat(null); S.chatHistory = []; renderView(); };
  document.querySelectorAll("[data-chat]").forEach((b) => (b.onclick = () => openChat(b.dataset.chat)));
  document.querySelectorAll("[data-delchat]").forEach((b) => (b.onclick = async () => {
    const c = S.chats.chats.find((x) => x.id === b.dataset.delchat);
    if (!confirm(`Delete the chat "${c ? c.title : ""}"? Drafts made in it stay.`)) return;
    try { S.chats = await api("/app/chat/delete", "POST", { id: b.dataset.delchat }); if (b.dataset.delchat === S.chatId) { rememberChat(null); S.chatHistory = []; } renderView(); } catch (e) { toast(e.message); }
  }));
  document.querySelectorAll("[data-go]").forEach((b) => (b.onclick = () => go(b.dataset.go)));
  const ta = $("#cf textarea");
  const grow = () => { ta.style.height = "auto"; ta.style.height = Math.min(160, ta.scrollHeight) + "px"; };
  ta.value = S.chatDraft || ""; grow();
  ta.oninput = () => { S.chatDraft = ta.value; grow(); };
  ta.onkeydown = (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("#cf").requestSubmit(); } };
  document.querySelectorAll("[data-sugg]").forEach((b) => (b.onclick = () => { ta.value = S.chatDraft = b.dataset.sugg; grow(); ta.focus(); }));
  const fi = $("#cf [name=f]"); fi.onchange = () => { $("#att").textContent = fi.files[0] ? `📎 ${fi.files[0].name}` : ""; };
  $("#cf").onsubmit = (ev) => { ev.preventDefault(); sendChat(new FormData(ev.target)); };
  wireDrafts();
  const box = $("#msgs"); box.scrollTop = box.scrollHeight;
  if (!S.chatBusy) ta.focus();
}

async function fileToAttachment(f) {
  if (f.size > 3 * 1024 * 1024) throw new Error("Attach up to 3 MB");
  const b64 = async () => { const buf = new Uint8Array(await f.arrayBuffer()); let s = ""; for (let i = 0; i < buf.length; i += 0x8000) s += String.fromCharCode.apply(null, buf.subarray(i, i + 0x8000)); return btoa(s); };
  if (f.type === "application/pdf" || /\.pdf$/i.test(f.name)) return { kind: "pdf", name: f.name, base64: await b64() };
  if (/^image\/(png|jpeg|webp|gif)$/.test(f.type)) return { kind: "image", name: f.name, mediaType: f.type, base64: await b64() };
  return { kind: "text", name: f.name, text: (await f.text()).slice(0, 60000) };
}

async function sendChat(fd) {
  const message = String(fd.get("m") || "").trim();
  const f = fd.get("f");
  if (!message && !(f && f.size) || S.chatBusy) return;
  let attachment;
  try { attachment = f && f.size ? await fileToAttachment(f) : undefined; } catch (e) { toast(e.message); return; }
  S.chatHistory = [...(S.chatHistory || []), { role: "user", text: message || `📎 ${f.name}`, at: Date.now() }];
  S.chatBusy = true; S.chatDraft = ""; renderView();
  let failed = null;
  try {
    const r = await api("/app/chat", "POST", { chatId: S.chatId, message: message || `Read the attached ${f.name}`, lang: S.lang || "th", attachment });
    rememberChat(r.chatId);
  } catch (e) { failed = e.message; }
  S.chatBusy = false;
  const [h, d, c, ai] = await Promise.all([
    S.chatId ? api(`/app/chat?id=${encodeURIComponent(S.chatId)}`).catch(() => ({ history: S.chatHistory })) : Promise.resolve({ history: S.chatHistory }),
    api("/app/drafts").catch(() => ({ drafts: S.drafts || [] })), api("/app/chats").catch(() => S.chats), api("/app/ai").catch(() => S.ai),
  ]);
  // Failed: the message was not saved; keep it on screen with the error under it.
  S.chatHistory = failed ? [...S.chatHistory, { role: "error", text: failed, at: Date.now() }] : h.history;
  S.drafts = d.drafts; S.chats = c; S.ai = ai;
  if (S.view === "chat") renderView();
}

/** A delivered image or PDF page, watermarked (the same preview as the website), with page buttons. */
function previewDialog(dealId, index, name) {
  const dlg = $("#dlg"), form = $("#dlg-form");
  let page = 1, pages = 1;
  dlg.style.width = "min(900px, 94vw)";
  const show = async () => {
    $("#pv").innerHTML = `<div class="loading" style="padding:40px 0;justify-content:center"><span class="spin"></span>Making the preview…</div>`;
    try {
      const res = await fetch(`/app/preview?deal=${dealId}&index=${index}&page=${page}`, { headers: { "x-app-token": TOKEN } });
      if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || `Preview failed (${res.status})`);
      pages = Number(res.headers.get("x-preview-pages")) || 1;
      const url = URL.createObjectURL(await res.blob());
      $("#pv").innerHTML = `<img src="${url}" alt="${esc(name)}, page ${page}" style="display:block;max-width:100%;max-height:70vh;margin:0 auto;border-radius:8px">`;
    } catch (e) { $("#pv").innerHTML = `<div class="err" style="display:block">${esc(e.message)}</div>`; }
    $("#pvnav").innerHTML = pages > 1 ? `<button type="button" id="pvp" ${page <= 1 ? "disabled" : ""}>‹ Prev</button><span class="hint">Page ${page} of ${pages}</span><button type="button" id="pvn" ${page >= pages ? "disabled" : ""}>Next ›</button>` : "";
    const p = $("#pvp"), n = $("#pvn");
    if (p) p.onclick = () => { page--; show(); };
    if (n) n.onclick = () => { page++; show(); };
  };
  form.innerHTML = `<div class="row space"><h2 style="margin:0">${esc(name)}</h2><button value="close">Close</button></div>
    <p class="hint">Watermarked preview (up to the first 5 pages of a PDF). The file itself opens for the buyer after approval.</p>
    <div id="pv"></div><div class="row" id="pvnav" style="justify-content:center;margin-top:8px"></div>`;
  dlg.showModal();
  dlg.addEventListener("close", () => { dlg.style.width = ""; }, { once: true });
  show();
}

const fmtDay = (x) => new Date(`${x}T12:00:00`).toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" });
function dueLeft(x) { const n = Math.ceil((new Date(`${x}T23:59:59+07:00`).getTime() - Date.now()) / 86400000); return n > 1 ? `in ${n} days` : n === 1 ? "tomorrow" : n === 0 ? "today" : `late by ${-n} day${n === -1 ? "" : "s"}`; }
/** A milestone's due date (agreed by both sides): countdown, propose / accept, late refund request. */
function dueHtml(d, m) {
  const u = m.due;
  if (!u || m.delivery === "deposit") return "";
  const editable = d.status !== "Cancelled" && m.status === "Pending";
  const today = new Date(Date.now() + 7 * 3600000).toISOString().slice(0, 10);
  return `<div class="hint" style="margin-top:4px">Due: ${u.due ? `<span style="color:${u.late ? "var(--bad)" : "inherit"}">${esc(fmtDay(u.due))} · ${esc(dueLeft(u.due))}</span>` : "no date agreed"}
    ${u.proposedDue && u.proposedBy === "them" ? ` · they propose ${esc(fmtDay(u.proposedDue))} ${editable ? `<button class="primary" data-due="accept" data-deal="${d.id}" data-i="${m.index}" style="padding:2px 8px;font-size:11px">Accept</button>` : ""}` : ""}
    ${u.proposedDue && u.proposedBy === "me" ? ` · you proposed ${esc(fmtDay(u.proposedDue))} (waiting)` : ""}
    ${editable ? ` <input type="date" min="${today}" data-due-date="${d.id}-${m.index}" style="width:auto;padding:2px 6px;font-size:11px"> <button data-due="propose" data-deal="${d.id}" data-i="${m.index}" style="padding:2px 8px;font-size:11px">${u.due ? "Propose another date" : "Propose a due date"}</button>` : ""}
    ${u.late && d.role === "buyer" && !u.lateRequestedAt ? ` <button class="danger" data-due="late" data-deal="${d.id}" data-i="${m.index}" style="padding:2px 8px;font-size:11px">Ask for a refund (late)</button>` : ""}
    ${u.lateRequestedAt ? `<div style="color:var(--bad)">${d.role === "buyer" ? "You asked for a refund" : "The buyer asks for a refund: nothing was delivered by the agreed date"} (${esc(new Date(u.lateRequestedAt).toLocaleDateString())})</div>` : ""}</div>`;
}

const STATUS_CHIP = { Released: "ok", Approved: "ok", KeyReleased: "ok", Active: "ok", Disputed: "bad", Refunded: "warn", Cancelled: "warn", Delivered: "warn", Split: "warn" };
function dealHtml(d) {
  const now = Date.now() / 1000;
  const btn = (action, index, label, cls = "") => `<button class="${cls}" data-act="${action}" data-deal="${d.id}" data-i="${index}">${label}</button>`;
  const head = [];
  if (d.status === "Proposed") {
    if (d.offeredBy === "them") head.push(btn("accept", 0, d.role === "buyer" ? "Accept and pay" : "Accept the offer", "primary"));
    else head.push(btn("cancel", 0, "Cancel my offer", "danger"));
  }
  return `<div class="card deal"><div class="row space"><div><b>${esc(d.title)}</b> <span class="hint">D-${d.id}</span>
      <div class="hint">${d.role === "buyer" ? "You buy from" : "You sell to"} ${esc(d.counterpartyLabel)} ${d.counterpartyHasApp ? `<span class="chip ok">their app links to your chain</span>` : ""}</div></div>
      <div class="row"><span class="chip ${STATUS_CHIP[d.status] || ""}">${esc(d.status)}</span><b>${esc(d.total)}</b>${head.join("")}</div></div>
    ${d.milestones.map((m) => {
      const acts = [];
      if (d.status === "Active") {
        if (d.role === "buyer" && (m.status === "Delivered" || m.status === "KeyReleased")) { acts.push(btn("approve", m.index, "Approve and pay", "primary")); if (m.status === "Delivered") acts.push(`<button data-changes="${d.id}" data-i="${m.index}">Ask for changes</button>`); }
        if (d.role === "buyer" && m.status === "Pending" && m.deadline && m.deadline < now) acts.push(btn("reclaim", m.index, "Reclaim (late)"));
        if (d.role === "seller" && m.status === "Delivered" && m.deadline && m.deadline < now) acts.push(btn("claim", m.index, "Claim payment", "primary"));
        if (d.role === "seller" && m.status === "Pending" && m.delivery !== "deposit") acts.push(`<button class="primary" data-deliver="${d.id}" data-i="${m.index}">Deliver</button>`);
        if (d.role === "seller" && ["Pending", "Delivered", "Disputed"].includes(m.status)) acts.push(btn("refund", m.index, "Refund buyer", "danger"));
      }
      return `<div class="ms"><div>${esc(m.name)} · <b>${esc(m.amount)}</b> <span class="chip ${STATUS_CHIP[m.status] || ""}">${esc(m.status)}</span> <span class="hint">${esc(m.delivery || "")}</span>${dueHtml(d, m)}${m.split ? `<span class="hint"> seller ${esc(m.split.toSeller)} / buyer ${esc(m.split.toBuyer)}</span>` : ""}${m.file ? `<div class="hint">📎 ${esc(m.file.name)}</div>` : ""}</div><div class="row">${m.file && m.file.preview ? `<button data-preview="${d.id}" data-i="${m.index}" data-name="${esc(m.file.name)}">Preview</button>` : ""}${acts.join("")}</div></div>`;
    }).join("")}
  </div>`;
}

const ACTION_TEXT = { approve: "Approve this delivery and release its payment to the seller?", accept: "Accept this offer? As the buyer, the full amount is locked in escrow from your Mock Bank balance.", cancel: "Cancel your offer?", reclaim: "Take back this milestone's money (the seller missed the deadline)?", claim: "Claim this milestone's payment (the review window passed with no dispute)?", refund: "Refund this milestone to the buyer?", dispute: "Open a dispute: a neutral arbiter decides from the evidence." };

function confirmMove(action, dealId, index, requestId) {
  const dlg = $("#dlg"), form = $("#dlg-form");
  form.innerHTML = `<h2>Sign: ${esc(action)} · D-${esc(dealId)}${["cancel", "accept"].includes(action) ? "" : ` milestone ${Number(index) + 1}`}</h2><p>${esc(ACTION_TEXT[action] || "Sign this move?")}</p>
    ${action === "dispute" && !requestId ? `<label>What is wrong?</label><textarea name="reason" rows="4" minlength="10" required></textarea>` : ""}
    <p class="hint">This adds a block signed by your device key to your chain; the server carries it out.</p>
    <div class="err" id="de"></div><div class="row" style="justify-content:flex-end;margin-top:12px"><button value="cancel" formnovalidate>Back</button><button class="primary" id="dok" value="ok">Sign</button></div>`;
  dlg.showModal();
  form.onsubmit = async (ev) => {
    if (ev.submitter?.value !== "ok") return;
    ev.preventDefault();
    const ok = $("#dok"); ok.disabled = true; ok.textContent = "Signing…";
    try {
      const reason = new FormData(form).get("reason") || undefined;
      const r = await api("/app/move", "POST", { dealId: Number(dealId), action, index: Number(index), reason, requestId });
      if (!r.ok) throw new Error(r.error || "The server could not carry it out (the signed block stays on your chain)");
      dlg.close();
      toast(r.result && r.result.groupVote ? "Sent to your group's vote" : "Signed and done");
      await load();
    } catch (err) { showErr($("#de"), err); ok.disabled = false; ok.textContent = "Sign"; }
  };
}

function wireDueButtons() {
  document.querySelectorAll("[data-due]").forEach((b) => (b.onclick = async () => {
    const action = b.dataset.due, dealId = Number(b.dataset.deal), index = Number(b.dataset.i);
    const date = action === "propose" ? document.querySelector(`[data-due-date="${dealId}-${index}"]`)?.value : undefined;

  }));
}

let toastTimer;
function toast(text) {
  let t = $("#toast");
  if (!t) { t = document.createElement("div"); t.id = "toast"; t.style.cssText = "position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;z-index:9;max-width:90vw"; document.body.appendChild(t); }
  t.textContent = text; t.style.display = "block";
  clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.style.display = "none"), 3500);
}

async function load() {
  if (S.info.stage !== "ready") return;
  if (S.update === undefined) { S.update = null; api("/app/update").then((u) => { S.update = u; if (S.info.stage === "ready") renderApp(); }).catch(() => undefined); }
  try {
    S.info = await api("/app/state");
    if (S.view === "overview") { const [a, d] = await Promise.all([api("/app/account"), api("/app/deals")]); S.account = a; S.deals = d.deals; }
    if (S.view === "deals") S.deals = (await api("/app/deals")).deals;
    if (S.view === "chain") S.chain = await api("/app/chain");
    if (S.view === "chat") {
      if (S.chatId === undefined) { try { S.chatId = localStorage.getItem("awchat"); } catch { S.chatId = null; } }
      const [c, d, ai, mcp] = await Promise.all([api("/app/chats"), api("/app/drafts"), api("/app/ai").catch(() => null), api("/app/mcp").catch(() => null)]);
      S.chats = c; S.drafts = d.drafts; S.ai = ai; S.mcp = mcp;
      if (S.chatId && !c.chats.some((x) => x.id === S.chatId)) rememberChat(null);
      if (!S.chatBusy) S.chatHistory = S.chatId ? (await api(`/app/chat?id=${encodeURIComponent(S.chatId)}`)).history : (S.chatHistory || []).filter(() => !S.chatId);
    }
    if (S.view === "activity") { const [a, t] = await Promise.all([api("/app/activity"), api("/app/topup").catch(() => null)]); S.activity = a; S.topup = t; }
    if (S.view === "contacts" || S.view === "groups") { const f = await api("/app/friends"); S.friends = f.friends; S.friendsMe = f.me; }
    if (S.view === "links") S.links = (await api("/app/invite-links")).links;
    if (S.view === "ai") S.ai = await api("/app/ai").catch(() => null);
    if (S.view === "mcp") S.mcp = await api("/app/mcp");
    if (S.view === "groups") S.groups = await api("/app/groups");
  } catch (e) { toast(e.message); }
  if (S.info.stage === "ready") renderApp(); else render();
}
// The money view refreshes when the browser comes back from a Stripe payment.
window.addEventListener("focus", () => { if (S.info && S.info.stage === "ready" && S.view === "activity") load(); });

setInterval(async () => {
  if (!S.info || S.info.stage !== "ready" || S.chatBusy || document.querySelector("dialog[open]") || document.querySelector("#cf textarea")?.value) return;
  const before = JSON.stringify([S.info.height, (S.info.requests || []).length, (S.info.agentRequests || []).length]);
  try { S.info = await api("/app/state"); } catch { return; }
  if (JSON.stringify([S.info.height, (S.info.requests || []).length, (S.info.agentRequests || []).length]) !== before) load();
}, 10_000);

boot().then(load).catch((e) => { $("#root").innerHTML = `<div class="center"><div class="card narrow err" style="display:block">${esc(e.message)}</div></div>`; });
</script>
