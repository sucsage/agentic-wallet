<style>
/* Same look as the Kravii website (web/src/components/mockup.css, v08 theme): dark only. */
:root {
  --tb: 0px; --vh: 100vh;
  --bg: #101010; --side: #050505; --panel: #171717; --panel-2: #111111; --ink: #f5f6fa; --muted: #9da9ba; --dim: #8e8e93;
  --line: #343434; --line-2: #292929; --field: #0c0c0c; --field-line: #333333; --chip: #202020;
  --accent: #927cff; --accent-2: #8b69f6; --blue: #559bff; --user: #1a2635;
  --ok: #89ef82; --ok-bg: #12230f; --bad: #ff656e; --bad-bg: #2a1214; --warn: #f3ed21; --warn-bg: #24220c;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); }
body { margin: 0; font: 14px/1.5 Inter, "IBM Plex Sans Thai", system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; border: 1px solid var(--field-line); background: transparent; color: var(--ink); border-radius: 8px; padding: 8px 14px; font-size: 13px; font-weight: 600; transition: filter .15s, background .15s, border-color .15s; white-space: nowrap; }
button:hover { border-color: #555; background: #1a1a1a; }
button.primary { background: #fff; color: #111; border-color: #fff; }
button.primary:hover { filter: brightness(.88); background: #fff; }
button.danger { color: var(--bad); border-color: #5a2a2e; }
button.danger:hover { border-color: var(--bad); background: transparent; }
button:disabled { opacity: .5; cursor: default; filter: none; }
input, textarea, select { width: 100%; border: 1px solid var(--field-line); border-radius: 10px; padding: 9px 12px; background: var(--field); font-size: 13px; outline: none; }
input:focus, textarea:focus, select:focus { border-color: #6657a9; box-shadow: 0 0 0 3px #927cff22; }
input[type=checkbox] { accent-color: var(--accent); }
label { display: block; font-weight: 500; font-size: 12px; color: #c9ced6; margin: 12px 0 5px; }
a { color: var(--blue); }
.hint { color: var(--muted); font-size: 12px; }
.mono { font-family: var(--mono); font-size: 12px; word-break: break-all; }
.center { min-height: var(--vh); display: grid; place-items: center; padding: 24px 16px; background: #000; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 17px; padding: 18px; }
.narrow { width: min(420px, 100%); background: var(--panel-2); border-color: var(--line-2); border-radius: 20px; padding: 24px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; letter-spacing: -.01em; }

.tag { font-size: 10px; font-weight: 600; color: #c9b9ff; border: 1px solid #3b3166; background: #1a1530; border-radius: 99px; padding: 2px 8px; }
.tabs { display: flex; gap: 4px; margin: 16px 0 4px; padding: 4px; background: #0a0a0a; border: 1px solid var(--line-2); border-radius: 12px; }
.tabs button { flex: 1; border: 0; border-radius: 9px; padding: 8px 6px; font-weight: 500; color: var(--dim); }
.tabs button.on { background: #262626; color: #fff; }
.err { background: var(--bad-bg); color: var(--bad); border: 1px solid #5a2a2e; border-radius: 10px; padding: 8px 10px; margin-top: 12px; display: none; font-size: 13px; }
.ok-box { background: var(--ok-bg); color: var(--ok); border: 1px solid #2c4a27; border-radius: 10px; padding: 8px 10px; font-size: 13px; }
.layout { display: grid; grid-template-columns: 196px 1fr; min-height: var(--vh); }
nav { background: var(--side); padding: 14px 8px 10px; display: flex; flex-direction: column; gap: 2px; position: sticky; top: var(--tb); height: var(--vh); overflow-y: auto; }
nav .brand { margin: 2px 8px 14px; font-size: 15px; }
nav .group { color: #777; font-size: 9px; letter-spacing: .08em; text-transform: uppercase; margin: 12px 8px 5px; }
nav button { border: 0; border-left: 2px solid transparent; text-align: left; background: transparent; height: 32px; padding: 0 9px; border-radius: 8px; color: var(--dim); font-size: 12px; font-weight: 500; }
nav button:hover { background: #191919; color: #e6e6e8; }
nav button.on { background: #191919; color: #e6e6e8; border-left-color: var(--accent); font-weight: 700; padding-left: 7px; }
nav .foot { margin-top: auto; padding: 6px; border: 1px solid var(--line-2); border-radius: 9px; display: flex; align-items: center; gap: 8px; }
nav .avatar { width: 24px; height: 24px; border-radius: 50%; background: #fff; color: #111; display: grid; place-items: center; font-size: 9px; font-weight: 700; flex: none; }
nav .who { display: flex; flex-direction: column; min-width: 0; line-height: 1.3; flex: 1; }
nav .who b { font-size: 11px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
nav .who small { font-size: 10px; color: #85858a; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
nav .foot button { height: 26px; padding: 0 8px; font-size: 11px; border: 1px solid var(--line-2); border-left-width: 1px; }
main { padding: 26px 28px 50px; max-width: 1180px; width: 100%; }
h1 { font-size: 24px; letter-spacing: -.02em; margin: 0 0 16px; }
h2 { font-size: 15px; margin: 0 0 10px; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 13px; margin-bottom: 14px; }
.stat .v { font-size: 26px; font-weight: 700; letter-spacing: -.02em; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid #383838; border-radius: 20px; padding: 3px 10px; color: #c6d0de; font-size: 11px; white-space: nowrap; }
.chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--blue); }
.chip.ok { color: var(--ok); } .chip.ok::before { background: var(--ok); }
.chip.bad { color: var(--bad); } .chip.bad::before { background: var(--bad); }
.chip.warn { color: var(--warn); } .chip.warn::before { background: var(--warn); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.space { justify-content: space-between; }
.deal { margin-bottom: 12px; }
.ms { border-top: 1px solid var(--line-2); padding: 11px 0; display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 9px 6px; border-bottom: 1px solid var(--line-2); vertical-align: top; font-size: 13px; }
th { color: var(--muted); font-weight: 500; font-size: 11px; }
.banner { background: #1a1530; border: 1px solid #3b3166; color: #d9cfff; border-radius: 17px; padding: 14px 16px; margin-bottom: 14px; }
.banner .req { background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-top: 8px; }
.check { display: grid; grid-template-columns: 24px 1fr; gap: 8px; padding: 10px 0; border-bottom: 1px solid var(--line-2); }
dialog { border: 1px solid var(--line); border-radius: 20px; background: var(--panel-2); color: var(--ink); width: min(460px, 92vw); padding: 22px; }
dialog::backdrop { background: rgba(0,0,0,.6); backdrop-filter: blur(2px); }
.spin { width: 16px; height: 16px; border-radius: 50%; border: 2px solid #3a3a3a; border-top-color: var(--accent); display: inline-block; animation: spin .8s linear infinite; flex: none; }
button .spin { width: 13px; height: 13px; border-width: 2px; border-color: #bbb; border-top-color: #111; margin-right: 7px; vertical-align: -2px; }
@keyframes spin { to { transform: rotate(360deg); } }
.loading { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; }
.accounts { display: flex; flex-direction: column; gap: 6px; margin: 14px 0 4px; }
.acct { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 9px 10px; border: 1px solid var(--line-2); border-radius: 12px; background: #0c0c0c; font-weight: 500; }
.acct:hover { border-color: #4a4a4a; background: #121212; }
.acct.on { border-color: #6657a9; background: #1a1530; }
.acct .avatar { width: 30px; height: 30px; border-radius: 50%; background: #fff; color: #111; display: grid; place-items: center; font-size: 11px; font-weight: 700; flex: none; }
.acct .who { display: flex; flex-direction: column; min-width: 0; line-height: 1.3; }
.acct .who b { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.acct .who small { font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.linkbtn { border: 0; background: none; padding: 0; color: var(--blue); font-weight: 500; font-size: 12.5px; }
.linkbtn:hover { background: none; text-decoration: underline; }
.demo { font-size: 11px; color: #c9b9ff; margin-top: 14px; text-align: center; }
.msgs { display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
.msg { max-width: 78%; padding: 12px 14px; border-radius: 17px; white-space: pre-wrap; word-break: break-word; font-size: 13.5px; }
.msg.user { align-self: flex-end; background: var(--user); border: 1px solid #253447; }
.msg.assistant { align-self: flex-start; background: var(--panel); border: 1px solid var(--line); white-space: normal; color: #e3e6ed; }
.msg .tools { margin-top: 8px; display: flex; gap: 4px; flex-wrap: wrap; }
.md > :first-child { margin-top: 0; } .md > :last-child { margin-bottom: 0; }
.md p, .md ul, .md ol, .md pre, .md blockquote, .md table { margin: 6px 0; }
.md ul, .md ol { padding-left: 20px; } .md h3, .md h4, .md h5, .md h6 { margin: 10px 0 4px; font-size: 14px; }
.md code { font-family: var(--mono); font-size: 12px; background: #262626; padding: 1px 5px; border-radius: 5px; }
.md pre { background: #0c0c0c; border: 1px solid var(--line-2); padding: 10px; border-radius: 10px; overflow-x: auto; } .md pre code { background: none; padding: 0; }
.md blockquote { border-left: 3px solid var(--line); padding-left: 10px; color: var(--muted); }
.md table { border-collapse: collapse; font-size: 12.5px; display: block; overflow-x: auto; } .md th, .md td { border: 1px solid var(--line); padding: 5px 9px; }
.md a { color: var(--blue); } .md hr { border: 0; border-top: 1px solid var(--line); }
.composer { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: end; position: sticky; bottom: 0; background: var(--bg); padding: 10px 0; }
.composer textarea { resize: vertical; min-height: 46px; max-height: 200px; border-radius: 13px; }
.issue { font-size: 12px; padding: 5px 9px; border-radius: 9px; margin-top: 5px; }
.issue.block { background: var(--bad-bg); color: var(--bad); } .issue.warn { background: var(--warn-bg); color: var(--warn); }
.in { color: var(--ok); } .out { color: var(--bad); }
.acting { margin: 0 4px 10px; padding: 8px; border: 1px solid var(--line-2); border-radius: 10px; }
.acting.on { border-color: #6657a9; background: #1a1530; }
.acting small { display: block; font-size: 9px; letter-spacing: .08em; text-transform: uppercase; color: #888; margin-bottom: 4px; }
.acting select { padding: 5px 8px; font-size: 12px; }
.acting .hint { font-size: 10px; margin-top: 4px; }
.mainwrap { min-width: 0; display: flex; flex-direction: column; }
#hdr .topbar { position: relative; display: flex; gap: 8px; align-items: center; padding: 10px 28px 0; }
#hdr .topbar input { max-width: 420px; }
#hdr .topbar > button { padding: 6px 10px; }
.bell-n { background: var(--bad); color: #fff; border-radius: 99px; padding: 0 6px; font-size: 10px; }
.bell-pop { position: absolute; top: 46px; right: 28px; z-index: 20; width: min(420px, 90vw); max-height: 60vh; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 6px; box-shadow: 0 10px 30px #0008; }
#x-hits .bell-pop { left: 28px; right: auto; }
.bell-pop button { display: block; width: 100%; text-align: left; border: 0; white-space: normal; font-weight: 500; }
/* AI chat: the website's layout (saved chats · conversation · agent rail). */
main.wide { max-width: none; padding: 20px 22px 24px; }

.a-msg .card.deal { background: #121212; margin: 10px 0 0; }
.composer2 { position: relative; display: flex; align-items: flex-end; gap: 10px; padding: 10px 12px 26px; border: 1px solid #333; border-radius: 14px; background: #0b0b0b; flex: none; }
.composer2 > button, .composer2 > label { width: 32px; height: 32px; flex: none; border: 0; border-radius: 8px; background: #1b1b1b; color: #eee; font-size: 18px; padding: 0; display: grid; place-items: center; margin: 0; cursor: pointer; }

.composer2 > small { position: absolute; left: 56px; bottom: 7px; color: #666; font-size: 10px; }
.find-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; }
.find-card { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; border: 1px solid var(--line-2); border-radius: 12px; padding: 10px 12px; background: #0e0e0e; }
.find-card > div { min-width: 0; } .find-card p { margin: 4px 0; font-size: 12px; color: #bbb; } .find-card small { color: #777; font-size: 11px; word-break: break-all; }
.find-card > button { flex: none; padding: 5px 12px; font-size: 12px; }
.composer2 > .tools-btn { position: relative; font-size: 0; color: #cfcfd4; }
.tools-btn i { position: absolute; top: -5px; right: -5px; min-width: 15px; height: 15px; border-radius: 99px; background: var(--accent); color: #fff; font: 600 9px/15px Inter, system-ui, sans-serif; font-style: normal; padding: 0 3px; }

.trow { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 5px 0; }

.rail h3 { font-size: 13px; margin: 0 0 8px; } .rail section + section { margin-top: 14px; padding-top: 14px; border-top: 1px solid #2a2a2a; }

.tier b { font-size: 11px; color: #9a7cff; }
.bar { height: 6px; border-radius: 99px; background: var(--chip); overflow: hidden; margin: 3px 0 6px; } .bar i { display: block; height: 100%; }
.switch { display: flex; align-items: flex-start; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line-2); margin: 0; font-size: 13px; color: var(--ink); cursor: pointer; }
.switch input { width: 16px; height: 16px; margin-top: 2px; flex: none; }
@media (max-width: 1180px) { .chat-layout { grid-template-columns: 210px minmax(0,1fr); } .rail { grid-column: 1 / -1; position: static; max-height: none; } }

  .layout { grid-template-columns: 1fr; }
  nav { flex-direction: row; overflow-x: auto; height: auto; position: static; padding: 8px; gap: 4px; }
  nav .brand, nav .group, nav .foot { display: none; }
  nav button { white-space: nowrap; flex: none; border-left: 0; }
  nav button.on { border-left: 0; padding-left: 9px; }
  main { padding: 16px 14px 36px; }

}

#titlebar { position: fixed; top: 0; left: 0; right: 0; height: var(--tb); z-index: 1000; background: #000; display: flex; align-items: center; justify-content: center; user-select: none; -webkit-user-select: none; cursor: default; border-bottom: 1px solid #161616; }
#titlebar > span { color: #8e8e93; font-size: 12px; font-weight: 600; letter-spacing: .01em; pointer-events: none; }
#titlebar .wctl { position: absolute; right: 0; top: 0; height: 100%; display: flex; }
#titlebar .wctl button { width: 46px; height: 100%; border: 0; border-radius: 0; padding: 0; background: transparent; color: #cfcfd4; font-size: 13px; font-weight: 400; display: grid; place-items: center; }
#titlebar .wctl button:hover { background: #262626; }

<body>
<div id="root"><div class="center"><div class="loading"><span class="spin"></span>Opening Kravii…</div></div></div>
<dialog id="dlg"><form method="dialog" id="dlg-form"></form></dialog>
<script>/*MARKDOWN*/</script>
<script>
"use strict";
// The windowed app's title bar (?chrome=mac|win), read before the address is cleaned up below.
const CHROME = (() => { const q = new URLSearchParams(location.search).get("chrome"); try { if (q) sessionStorage.setItem("awchrome", q); return q || sessionStorage.getItem("awchrome") || ""; } catch { return q || ""; } })();
// The token from the URL the app opened (#t=...): every call to the local app carries it.
(function () {
  const m = location.hash.match(/t=([\w-]+)/);
  if (m) { try { sessionStorage.setItem("awt", m[1]); } catch {} history.replaceState(null, "", "/"); }
})();
const TOKEN = (() => { try { return sessionStorage.getItem("awt") || ""; } catch { return ""; } })();
const $ = (s, el = document) => el.querySelector(s);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const short = (h) => (h ? `${h.slice(0, 10)}…${h.slice(-6)}` : "");
const money = (n, cur) => `${Number(n).toLocaleString(undefined, { maximumFractionDigits: 2 })} ${cur || ""}`.trim();
const when = (t) => (t ? new Date(t).toLocaleString() : "");

/**
 * Every call to the app gets a time limit, so a button never spins forever: the app itself gives up
 * on a website request after 75 s, and a move can make two of them (sync, then the move).
 */
const PAGE_TIMEOUT = 170000, FILE_TIMEOUT = 220000;
async function timed(url, init, ms = PAGE_TIMEOUT) {
  try { return await fetch(url, { ...init, signal: AbortSignal.timeout(ms) }); }
  catch (e) { throw new Error(e && (e.name === "TimeoutError" || e.name === "AbortError") ? "This is taking too long: check your internet, then refresh to see whether it went through before you try again" : "The app is not answering: is Kravii still running?"); }
}
async function api(path, method = "GET", body) {
  const r = await timed(path, { method, headers: { "x-app-token": TOKEN, "content-type": "application/json" }, body: body === undefined ? undefined : JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || `Error ${r.status}`);
  return j;
}

// ---------------------------------------------------------------- window: title bar and display size
const ZOOMS = [0.8, 0.9, 1, 1.1, 1.25, 1.4];
/** Display size that fits the screen: smaller on laptops (or high Windows scaling), larger on big screens. */
// Whole steps only on usual screens: 1080p at 100% or 125% scaling stays at 100% (sharper text).
const autoZoom = () => { const w = screen.availWidth || innerWidth; return w < 1250 ? 0.9 : w > 2300 ? 1.1 : 1; };
const zoomPref = () => { try { return localStorage.getItem("awzoom") || "auto"; } catch { return "auto"; } };
const zoomNow = () => { const p = zoomPref(); return p === "auto" ? autoZoom() : Number(p) || 1; };
function applyZoom() {
  const z = zoomNow(), tb = CHROME === "mac" ? 36 : CHROME === "win" ? 34 : 0;
  document.body.style.zoom = String(z);
  const r = document.documentElement.style;
  r.setProperty("--tb", `${tb / z}px`);
  r.setProperty("--vh", `${(innerHeight - tb) / z}px`);
}
function setZoom(p) { try { localStorage.setItem("awzoom", String(p)); } catch {} applyZoom(); }
function windowChrome() {
  if (CHROME) {
    document.body.classList.add("chrome");
    const bar = document.createElement("div");
    bar.id = "titlebar"; bar.className = "electrobun-webkit-app-region-drag";
    bar.innerHTML = `<span>Kravii</span>${CHROME === "win" ? `<div class="wctl electrobun-webkit-app-region-no-drag"><button data-w="minimize" title="Minimize">&#8211;</button><button data-w="maximize" title="Maximize">&#9633;</button><button class="x" data-w="close" title="Close (Kravii keeps running in the tray)">&#10005;</button></div>` : ""}`;
    document.body.prepend(bar);
    bar.querySelectorAll("[data-w]").forEach((b) => (b.onclick = () => api("/app/window", "POST", { op: b.dataset.w }).catch(() => undefined)));
    bar.ondblclick = (e) => { if (!e.target.closest("[data-w]")) api("/app/window", "POST", { op: "maximize" }).catch(() => undefined); };
  }
  applyZoom();
  addEventListener("resize", applyZoom);
  // Right-click: no browser menu (Back, Reload, Inspect…) on the app's screens; text boxes and
  // selected text keep the system's Cut / Copy / Paste menu.
  addEventListener("contextmenu", (e) => {
    const t = e.target;
    const editable = t && t.closest && t.closest("input, textarea, select, [contenteditable=''], [contenteditable=true]");
    const selected = String(getSelection && getSelection()).trim();
    if (!editable && !selected) e.preventDefault();
  });
  // Ctrl/⌘ + and − change the display size, Ctrl/⌘ 0 goes back to the size that fits the screen.
  addEventListener("keydown", (e) => {
    if (!(e.metaKey || e.ctrlKey) || e.altKey) return;
    const cur = zoomNow();
    if (e.key === "=" || e.key === "+") { e.preventDefault(); setZoom(ZOOMS.find((z) => z > cur + 0.001) || ZOOMS[ZOOMS.length - 1]); }
    else if (e.key === "-") { e.preventDefault(); setZoom([...ZOOMS].reverse().find((z) => z < cur - 0.001) || ZOOMS[0]); }
    else if (e.key === "0") { e.preventDefault(); setZoom("auto"); }
  });
}
windowChrome();

const S = { lang: (() => { try { return localStorage.getItem("awlang") || "th"; } catch { return "th"; } })(), info: null, view: "overview", account: null, deals: null, chain: null, verify: null, busy: false };

function showErr(el, e) { el.textContent = e.message || String(e); el.style.display = "block"; }

async function boot() {
  if (!TOKEN) { $("#root").innerHTML = `<div class="center"><div class="card narrow"><div class="brand"><span class="mark"></span>Kravii</div><p>Open the app from the link it printed in its window (it carries a private token).</p></div></div>`; return; }
  S.info = await api("/app/state");
  render();
}

function render() {
  const st = S.info.stage;
  if (st === "setup") return renderSetup();
  if (st === "locked") return renderUnlock();
  if (st === "onboarding") return renderOnboarding();
  renderApp();
}

// ---------------------------------------------------------------- setup / restore / unlock
const initials = (name) => (name || "?").split(/\s+/).filter(Boolean).map((w) => w[0]).join("").slice(0, 2).toUpperCase();
const host = (u) => { try { return new URL(u).host; } catch { return u || ""; } };
const busy = (btn, text) => { btn.disabled = true; btn.dataset.label = btn.textContent; btn.innerHTML = `<span class="spin"></span>${esc(text)}`; };
const idle = (btn) => { btn.disabled = false; btn.textContent = btn.dataset.label || btn.textContent; };
function loadingScreen(text) { $("#root").innerHTML = `<div class="center"><div class="loading"><span class="spin"></span>${esc(text)}</div></div>`; }

function renderSetup(tab = "link") {
  const hasAccounts = (S.info.accounts || []).length > 0;
  const TABS = [["link", "Link with code"], ["signup", "Create account"], ["restore", "Restore"]];
  const serverField = `<label>Server</label><input name="server" value="${esc(S.info.defaultServer)}" />`;
  const pass = `<label>App passphrase</label><input name="passphrase" type="password" minlength="8" required />
        <div class="hint">Encrypts this computer's key. It never leaves the computer; nobody can reset it.</div>
        <label>App passphrase again</label><input name="again" type="password" required />`;
  const computer = `<label>Name of this computer</label><input name="deviceName" value="${esc(S.info.hostname)}" />`;
  const body = {
    signup: `${serverField}<p class="hint" style="margin:12px 0 0">New accounts are made on the Kravii website: sign up, verify your identity with the digital ID, and your wallet opens. Then, on the website, open Profile → Desktop app → <b>Make a link code</b>, and enter it here under <b>Link with code</b>.</p>`,
    link: `${serverField}<label>Link code</label><input name="code" placeholder="ABCD-EFGH" autocomplete="off" required /><div class="hint">No account yet? Create one on the website first. Then on the website: Profile → Desktop app → Make a link code (valid 10 minutes).</div>${computer}${pass}`,
    restore: `<label>Key backup file</label><input name="file" type="file" accept=".json,application/json" required /><div class="hint">The file you saved from Settings → Save key backup.</div><label>App passphrase</label><input name="passphrase" type="password" required />`,
  }[tab];
  const label = { signup: "Open sign-up on the website", link: "Link this computer", restore: "Restore" }[tab];
  const working = { signup: "Opening…", link: "Linking…", restore: "Restoring…" }[tab];
  $("#root").innerHTML = `<div class="center"><div class="card narrow">
    <div class="row space"><div class="brand"><span class="mark"></span>Kravii <span class="tag">Wallet</span></div>${hasAccounts ? `<button class="linkbtn" id="back">← Accounts</button>` : ""}</div>
    <p class="hint">${hasAccounts ? "Add another account to this computer." : "Your deals as your own chain on this computer. The website keeps only its latest block, signed by both sides."}</p>
    <div class="tabs" style="flex-wrap:wrap">${TABS.map(([k, l]) => `<button data-t="${k}" class="${tab === k ? "on" : ""}">${l}</button>`).join("")}</div>
    <form id="f">${body}<div class="err" id="e"></div><div class="row" style="margin-top:16px"><button class="primary" id="go">${label}</button></div>
    ${tab === "signup" ? `<p class="hint" id="opened" style="display:none">The website opened in your browser. Signed up and verified? Make a link code there, then <button type="button" class="linkbtn" id="tologin">Link with code</button></p>` : ""}</form>
    <div class="demo">Demo · test money · no real funds</div>
  </div></div>`;
  document.querySelectorAll(".tabs button").forEach((b) => (b.onclick = () => renderSetup(b.dataset.t)));
  const back = $("#back"); if (back) back.onclick = () => renderUnlock();
  const tl = $("#tologin"); if (tl) tl.onclick = () => renderSetup("link");
  $("#f").onsubmit = async (ev) => {
    ev.preventDefault();
    const f = new FormData(ev.target), e = $("#e"), go = $("#go");
    e.style.display = "none";
    try {
      busy(go, working);
      if (tab === "signup") {
        await api("/app/open-signup", "POST", { server: f.get("server") });
        $("#opened").style.display = "block";
        idle(go);
        return;
      }
      if (tab === "restore") {
        await api("/app/restore", "POST", { keyBackup: await f.get("file").text(), passphrase: f.get("passphrase") });
      } else {
        if (f.get("passphrase") !== f.get("again")) throw new Error("The app passphrases differ");
        await api("/app/setup", "POST", { mode: tab === "link" ? "code" : tab, server: f.get("server"), code: f.get("code"), email: f.get("email"), password: f.get("password"), passphrase: f.get("passphrase"), deviceName: f.get("deviceName") });
      }
      loadingScreen("Opening your wallet…");
      S.info = await api("/app/state");
      S.view = "overview";
      await load();
    } catch (err) { showErr(e, err); idle(go); }
  };
}

let onboardTimer;
async function renderOnboarding() {
  const d = S.info.device;
  let st = { identity: "NONE", lastCheck: null, account: null, wallet: null };
  try { st = await api("/app/onboarding"); } catch (e) { toast(e.message); }
  const verified = st.identity === "VERIFIED" || st.account;
  $("#root").innerHTML = `<div class="center"><div class="card narrow">
    <div class="brand"><span class="mark"></span>Welcome, ${esc(d.user)}</div>
    <p class="hint">Two steps open your wallet. Test mode: the digital ID is a demo.</p>
    <div class="check"><div>${verified ? "✅" : "1"}</div><div><b>Verify your identity</b>
      <div class="hint">${verified ? "Verified · your wallet account is open." : st.identity === "PENDING" ? "Waiting for a reviewer." : "With your national digital ID (mock ThaID for Thailand, mock 国家网络身份认证 for China). It opens in your browser."}</div>
      ${st.lastCheck && !verified && st.lastCheck !== "ok" ? `<div class="issue block">${esc(st.lastCheck)}</div>` : ""}
      ${verified ? "" : `<div class="row" style="margin-top:8px"><select id="country" style="width:auto"><option value="TH">Thailand · ThaID</option><option value="CN">China · 网号</option></select><button class="primary" id="kyc">Verify in my browser</button></div>`}</div></div>
    <div class="check"><div>${st.wallet ? "✅" : "2"}</div><div><b>Create my wallet</b><div class="hint">Your agent wallet on the chain and your own deal chain on this computer (about 10 seconds).</div>
      ${verified ? `<button class="primary" id="fin" style="margin-top:8px">Create my wallet</button>` : ""}</div></div>
    <div class="err" id="e"></div>
    <div class="row space" style="margin-top:12px"><span class="hint">This page checks every few seconds.</span><button id="lock">Lock</button></div>
  </div></div>`;
  $("#lock").onclick = async () => { clearInterval(onboardTimer); S.info = await api("/app/lock", "POST"); render(); };

  const ar = S.info.agentRequests || [];
  if (!ar.length) return "";

  return `<div class="banner"><b>Requests from AI agents</b> · they cannot sign; you decide
    ${ar.map((r) => `<div class="req row space"><div><b>${what(r)}</b><div class="hint">from ${esc(r.client)} · ${when(r.createdAt)}</div>${r.why ? `<div class="hint">“${esc(r.why)}”</div>` : ""}${r.reason ? `<div class="hint">reason: ${esc(r.reason)}</div>` : ""}</div>
      <div class="row"><button class="primary" data-asign="${esc(r.id)}">Sign</button><button data-areject="${esc(r.id)}">Reject</button></div></div>`).join("")}</div>`;
}

function requestsBanner() {

        <select id="zoom" style="width:auto">${[["auto", `Fit this screen (${Math.round(autoZoom() * 100)}%)`], ...ZOOMS.map((z) => [String(z), `${Math.round(z * 100)}%`])].map(([v, t]) => `<option value="${v}" ${zoomPref() === v ? "selected" : ""}>${t}</option>`).join("")}</select></div>

    $("#quit").onclick = async () => { if (!confirm("Quit Kravii? Open it again to use it.")) return; await api("/app/quit", "POST").catch(() => null); $("#root").innerHTML = `<div class="center"><div class="card narrow">Kravii has stopped.</div></div>`; };
    $("#zoom").onchange = (e) => setZoom(e.target.value);

/** What a deal asks in files (the Files filter): documents asked for, a PDF, a file I owe, a file to review. */
function dealFiles(d) {
  const files = (d.milestones || []).filter((m) => m.delivery === "file");
  const live = d.status === "Active";
  return {
    asks: files.length > 0,
    pdf: files.some((m) => (m.fileTypes || []).some((t) => /pdf/i.test(t))),
    todo: live && d.role === "seller" && files.some((m) => m.status === "Pending"),
    review: live && d.role === "buyer" && files.some((m) => m.status === "Delivered"),
  };
}
function dealsShown() {
  const q = (S.dealQ || "").trim().toLowerCase(), f = S.dealFile || "all";
  return (S.deals || []).filter((d) => (f === "all" || dealFiles(d)[f]) && (!q || [`d-${d.id}`, d.title, d.counterpartyLabel, d.counterparty, d.status].some((x) => String(x || "").toLowerCase().includes(q))));
}

function updateHtml() {
  const u = S.update;
  if (!u) return `<div class="loading"><span class="spin"></span>Checking for updates…</div>`;
  if (S.updating) return `<div class="loading"><span class="spin"></span>${esc(S.updating)}</div>`;
  return `<table><tr><th>This version</th><td>${esc(u.current)} <span class="hint">(${esc(u.platform)})</span></td></tr><tr><th>Latest release</th><td>${u.latest ? esc(u.latest) : "-"}${u.date ? ` <span class="hint">${new Date(u.date).toLocaleDateString()}</span>` : ""}</td></tr></table>
    ${u.available ? `<div class="banner" style="margin:10px 0 0"><b>Version ${esc(u.latest)} is out.</b>${u.notes ? `<div class="hint" style="white-space:pre-wrap;margin-top:4px">${esc(u.notes).slice(0, 600)}</div>` : ""}</div>` : u.latest ? `<p class="ok-box" style="margin:10px 0 0">You have the latest version.</p>` : ""}
    ${u.reason && u.available ? `<p class="hint">${esc(u.reason)}</p>` : u.reason && !u.latest ? `<p class="hint">${esc(u.reason)}</p>` : ""}
    <div class="row" style="margin-top:10px">${u.canInstall ? `<button class="primary" id="upd-go">Update to ${esc(u.latest)} and restart</button>` : u.available && u.download ? `<a href="${esc(u.download)}" target="_blank" rel="noopener"><button class="primary">Download ${esc(u.latest)}</button></a>` : ""}<button id="upd-check">Check now</button>${u.page ? `<a href="${esc(u.page)}" target="_blank" rel="noopener"><button>Release page</button></a>` : ""}</div>
    ${u.canInstall ? `<p class="hint">The new version is checked against its SHA-256 before it replaces this one. The app restarts and asks for your passphrase again.</p>` : ""}`;
}

function wireUpdate() {
  const c = $("#upd-check"); if (c) c.onclick = async () => { S.update = null; $("#upd").innerHTML = updateHtml(); S.update = await api("/app/update?force=1").catch((e) => ({ current: "?", reason: e.message })); renderView(); };
  const g = $("#upd-go"); if (g) g.onclick = async () => {
    if (!confirm(`Update Kravii to ${S.update.latest}? It restarts and asks for your passphrase again.`)) return;
    S.updating = "Downloading and checking the new version…"; $("#upd").innerHTML = updateHtml();
    try {
      const r = await api("/app/update", "POST");
      S.updating = `Restarting as version ${r.version}…`; $("#upd").innerHTML = updateHtml();
      // The new process takes over the same port and token; reload once it answers with the new version.
      for (let i = 0; i < 80; i++) {
        await new Promise((ok) => setTimeout(ok, 500));
        const p = await fetch("/ping").then((x) => x.json()).catch(() => null);
        if (p && p.version === r.version) { location.reload(); return; }
      }
      S.updating = null; toast("The app did not come back: open Kravii again"); renderView();
    } catch (e) { S.updating = null; toast(e.message); renderView(); }
  };
}

/** A line in the menu when a newer version is out (checked once per launch). */
function updateNudge() {
  const u = S.update;
  return u && u.available ? `<button data-v="settings" style="color:var(--accent);font-weight:700">⬆ Update to ${esc(u.latest)}</button>` : "";
}

/** After Confirm or Discard: reload the previews and deals on screen (yours, and any group's opened under Groups). */
async function refreshDealLists() {
  const jobs = [api("/app/drafts").then((d) => (S.drafts = d.drafts)).catch(() => undefined)];
  if (S.view === "deals") jobs.push(api("/app/deals").then((d) => (S.deals = d.deals)).catch(() => undefined));
  for (const gid of Object.keys(S.groupDeals || {})) jobs.push(loadGroupDeals(gid));
  await Promise.all(jobs);
  renderView();
}

/** A group's deals and the previews its members drafted for it (yours), read as that group. */
async function loadGroupDeals(gid) {
  const g = ((S.groups && S.groups.groups) || []).find((x) => x.id === gid);
  if (!g || !g.wallet) return;
  const c = encodeURIComponent(g.wallet.companyId);
  try {
    const [d, p] = await Promise.all([api(`/app/deals?company=${c}`), api(`/app/drafts?company=${c}`)]);
    S.groupDeals[gid] = { deals: d.deals, drafts: p.drafts };
  } catch (e) { S.groupDeals[gid] = { error: e.message }; }
}

function groupDealsHtml(x) {
  if (!x.wallet) return "";
  S.groupDeals = S.groupDeals || {};
  const open = S.groupOpen && S.groupOpen[x.id];
  const gd = S.groupDeals[x.id];
  const head = `<div class="row space" style="margin-top:10px"><b>Deals</b><div class="row"><button data-gdeals="${esc(x.id)}">${open ? "Hide" : "Show deals and previews"}</button>${open ? `<button data-actdeals="${esc(x.id)}">Open in Deals (act as ${esc(x.wallet.name)})</button>` : ""}</div></div>`;
  if (!open) return head;
  if (!gd) return head + `<div class="loading" style="margin-top:8px"><span class="spin"></span>Loading the group's deals…</div>`;
  if (gd.error) return head + `<p class="hint">${esc(gd.error)}</p>`;
  const waiting = gd.drafts.filter((d) => ["PREVIEW", "DRAFT", "FAILED"].includes(d.status));
  const done = (d) => d.milestones.filter((m) => ["Released", "Split", "Refunded"].includes(m.status)).length;
  return head + (waiting.length ? `<div class="hint" style="margin-top:8px">Previews waiting for Confirm (yours, for this group)</div>${waiting.map((d) => draftCard(d, x.wallet.companyId)).join("")}` : "") +
    (gd.deals.length ? `<table style="margin-top:8px"><thead><tr><th>Deal</th><th>Role</th><th>Status</th><th>Milestones</th><th>Total</th></tr></thead><tbody>${gd.deals.map((d) => `<tr><td><b>D-${esc(d.id)}</b> ${esc(d.title)}<div class="hint">${esc(d.counterpartyLabel || short(d.counterparty))}</div></td><td>${d.role === "buyer" ? "buying" : "selling"}</td><td><span class="chip ${STATUS_CHIP[d.status] || ""}">${esc(d.status)}</span></td><td>${done(d)} / ${d.milestones.length}</td><td>${esc(d.total)}</td></tr>`).join("")}</tbody></table>` : `<p class="hint" style="margin-top:8px">No deals yet. Act as the group and ask the AI to draft one.</p>`) +
    `<p class="hint">To deliver, approve or ask for changes on a group deal: Open in Deals.</p>`;
}

/** A group's shared wallet: balance and account, or (for the owner) the button to open one. */
function groupWalletHtml(x) {
  const w = x.wallet;
  if (!w) {
    return `<div class="ms" style="grid-template-columns:1fr auto"><div><b>Group wallet</b><div class="hint">${x.myRole === "ADMIN" ? "Not opened yet. A group wallet hires and sells in the group's name; its money moves only after " + x.threshold + " signers approve." : "Not opened yet: the group's owner can open one."}</div></div>
      <div class="row">${x.myRole === "ADMIN" ? `<button class="primary" data-gwopen="${esc(x.id)}" data-name="${esc(x.name)}" data-th="${x.threshold}">Open a group wallet</button>` : ""}</div></div>`;
  }
  return `<div class="ms" style="grid-template-columns:1fr auto"><div><b>${w.kind === "GROUP" ? "Group" : "Company"} wallet</b> · <b>${money(w.balance, x.currency)}</b>
      <div class="hint">Account ${esc(w.accountNo || "-")} · payments and payouts need ${x.threshold} signers' votes</div></div>
    <div class="row">${S.info.acting && S.info.acting.groupId === x.id ? `<button data-actas="">Back to my own wallet</button>` : `<button class="primary" data-actas="${esc(x.id)}">Act as ${esc(w.name)}</button>`}<button data-gwfund="${esc(w.companyId)}" data-name="${esc(x.name)}" data-cur="${esc(x.currency)}">Add money</button>${x.iSign ? `<button data-gwpay="${esc(x.id)}">Pay out to members</button>` : ""}</div></div>`;
}

function wireGroupWallets() {
  document.querySelectorAll("[data-gdeals]").forEach((b) => (b.onclick = async () => {
    const gid = b.dataset.gdeals;
    S.groupOpen = S.groupOpen || {}; S.groupDeals = S.groupDeals || {};
    S.groupOpen[gid] = !S.groupOpen[gid];
    if (!S.groupOpen[gid]) { delete S.groupDeals[gid]; renderView(); return; }
    renderView(); await loadGroupDeals(gid); renderView();
  }));
  document.querySelectorAll("[data-actdeals]").forEach((b) => (b.onclick = async () => {
    try {
      const r = await api("/app/acting", "POST", { groupId: b.dataset.actdeals });
      S.info = { ...S.info, acting: r.acting }; S.deals = null; S.account = null; S.activity = null; S.drafts = null;
      go("deals");
    } catch (e) { toast(e.message); }
  }));
  document.querySelectorAll("[data-actas]").forEach((b) => (b.onclick = async () => {
    try {
      const r = await api("/app/acting", "POST", { groupId: b.dataset.actas || null });
      S.info = { ...S.info, acting: r.acting }; S.deals = null; S.account = null; S.activity = null; S.drafts = null;
      toast(r.acting ? `Acting as ${r.acting.name}: AI chat, deals and money now use its wallet` : "Back to your own wallet");
      renderApp(); load();
    } catch (e) { toast(e.message); }
  }));
  document.querySelectorAll("[data-gwopen]").forEach((b) => (b.onclick = async () => {
    if (!confirm(`Open a shared wallet for "${b.dataset.name}"? The group can then hire and sell in its own name; its money moves only after ${b.dataset.th} signers approve.`)) return;
    busy(b, "Opening (about 10 s)…");
    try { S.groups = await api("/app/groups", "POST", { op: "wallet", groupId: b.dataset.gwopen }); toast("Group wallet opened"); renderView(); } catch (e) { toast(e.message); idle(b); }
  }));
  document.querySelectorAll("[data-gwfund]").forEach((b) => (b.onclick = () => {
    const dlg = $("#dlg"), form = $("#dlg-form");
    form.innerHTML = `<h2>Add money to ${esc(b.dataset.name)}</h2><p class="hint">From your own wallet balance to the group's account (test money).</p>
      <label>Amount (${esc(b.dataset.cur)})</label><input name="amount" type="number" min="1" step="0.01" required><div class="err" id="fe"></div>
      <div class="row" style="justify-content:flex-end;margin-top:12px"><button value="cancel" formnovalidate>Cancel</button><button class="primary" id="fok" value="ok">Move money</button></div>`;
    const requestId = crypto.randomUUID();
    dlg.showModal();
    form.onsubmit = async (ev) => {
      if (ev.submitter?.value !== "ok") return;
      ev.preventDefault();
      const ok = $("#fok"); busy(ok, "Moving…");
      try { S.groups = await api("/app/groups", "POST", { op: "fund", companyId: b.dataset.gwfund, amount: Number(new FormData(form).get("amount")), requestId }); dlg.close(); toast("Added to the group wallet"); renderView(); }
      catch (e) { showErr($("#fe"), e); idle(ok); }
    };
  }));
  document.querySelectorAll("[data-gwpay]").forEach((b) => (b.onclick = () => {
    const g = S.groups.groups.find((x) => x.id === b.dataset.gwpay);
    const dlg = $("#dlg"), form = $("#dlg-form");
    form.innerHTML = `<h2>Pay out from ${esc(g.name)}</h2><p class="hint">Balance ${money(g.wallet.balance, g.currency)}. Everyone is paid together after ${g.threshold} signers approve (your proposal counts as your yes; votes are signed blocks).</p>
      ${g.members.map((mm) => `<div class="row" style="margin:6px 0"><span style="flex:1">${esc(mm.name)}</span><input name="a:${esc(mm.userId)}" type="number" min="0" step="0.01" placeholder="0" style="width:140px"></div>`).join("")}
      <div class="err" id="pe"></div>
      <div class="row" style="justify-content:flex-end;margin-top:12px"><button value="cancel" formnovalidate>Cancel</button><button class="primary" id="pok" value="ok">Propose the payout</button></div>`;
    dlg.showModal();
    form.onsubmit = async (ev) => {
      if (ev.submitter?.value !== "ok") return;
      ev.preventDefault();
      const recipients = [...new FormData(form).entries()].filter(([k, v]) => k.startsWith("a:") && Number(v) > 0).map(([k, v]) => ({ userId: k.slice(2), amount: Number(v) }));
      if (!recipients.length) { showErr($("#pe"), new Error("Enter an amount for at least one member")); return; }
      const ok = $("#pok"); busy(ok, "Proposing…");
      try { S.groups = await api("/app/groups", "POST", { op: "payout", groupId: g.id, recipients }); dlg.close(); toast("Payout proposed: waiting for the signers' votes"); renderView(); }
      catch (e) { showErr($("#pe"), e); idle(ok); }
    };
  }));
}

/** "Acting as": your own wallet, or a group's shared wallet (AI chat, deals, money and previews follow it). */
function actingSwitch() {
  const a = S.info.acting;
  const opts = (S.actingGroups || []).filter((g) => g.wallet);
  if (!a && !opts.length) return "";
  return `<div class="acting${a ? " on" : ""}"><small>Acting as</small><select id="acting">
    <option value="">${esc(S.info.device.user)} (personal)</option>
    ${opts.map((g) => `<option value="${esc(g.id)}" ${a && a.groupId === g.id ? "selected" : ""}>${esc(g.wallet.name)} (group)</option>`).join("")}
    ${a && !opts.some((g) => g.id === a.groupId) ? `<option value="${esc(a.groupId)}" selected>${esc(a.name)} (group)</option>` : ""}
  </select>${a ? `<div class="hint">Payments from it wait for its signers' vote</div>` : ""}</div>`;
}

function friendResults() {
  const q = (S.friendQ || "").trim();
  if (q.length < 2 || !S.friendFound) return "";
  const known = new Set((S.friends || []).map((f) => f.username));
  if (!S.friendFound.length) return `<p class="hint" style="margin:8px 0 0">No one matches “${esc(q)}”.</p>`;
  return `<div style="margin-top:8px">${S.friendFound.map((r) => `<div class="req row space"><div><b>${esc(r.name)}</b> <span class="hint">@${esc(r.username)}</span></div>${known.has(r.username) ? `<span class="hint">already added</span>` : `<button class="primary" data-addu="${esc(r.username)}">Send request</button>`}</div>`).join("")}</div>`;
}

function aiHtml() {
  const a = S.ai;
  if (!a) return `<p class="hint">Loading…</p>`;
  const u = a.usage;
  const bar = (label, used, limit, resets) => { const pct = limit > 0 ? Math.min(100, Math.round((used / limit) * 100)) : 100; return `<div style="margin:6px 0"><div class="row space hint"><span>${label}</span><span>${used.toLocaleString()} / ${limit.toLocaleString()} tokens · resets ${new Date(resets).toLocaleString(undefined, { weekday: "short", hour: "2-digit", minute: "2-digit" })}</span></div><div style="height:6px;border-radius:99px;background:var(--chip);overflow:hidden"><i style="display:block;height:100%;width:${pct}%;background:${pct >= 100 ? "var(--bad)" : pct >= 80 ? "var(--warn)" : "var(--accent)"}"></i></div></div>`; };
  const usage = u ? `<label>AI allowance (Kravii's AI)</label>${bar("Today", u.today, u.perDay, u.resetsDay)}${bar("This week", u.week, u.perWeek, u.resetsWeek)}<div class="hint">${a.own ? "You use your own key now: it is not counted." : "Use your own key below when the allowance runs out."}${u.ownKeyToday ? ` Your own key today: ${u.ownKeyToday.toLocaleString()} tokens.` : ""}</div>` : "";
  return `${usage}<label>Your instructions for the AI</label><textarea id="ins" rows="3" maxlength="1000" placeholder="e.g. Always answer in Thai. Suggest 2 milestones by default.">${esc(a.aiInstructions || "")}</textarea>
    <div class="hint">Shapes tone, language and defaults, here and on the website. They never override the rules: payees, limits, terms review and your signature always apply.</div>
    <div class="row" style="margin-top:6px"><button id="ins-save">Save instructions</button></div>
    <label style="margin-top:16px">Model</label>
    ${a.own ? `<div class="row space"><div>Your own key · <b>${esc(a.own.provider)}</b> · ${esc(a.own.model)} <span class="mono hint">${esc(a.own.key)}</span></div><button id="key-rm" class="danger">Use Kravii's AI</button></div>`
      : `<p class="hint" style="margin:0 0 6px">Now: Kravii's AI. Or bring your own key: it is sealed on this computer with your device key and sent only with your chat messages, for that request (never stored by the server).</p>
      <form id="kf"><div class="row"><select name="provider" style="width:auto"><option value="openrouter">OpenRouter (OpenAI, Google, Anthropic…)</option><option value="anthropic">Anthropic</option></select>
      <input name="model" placeholder="model, e.g. openai/gpt-5.5 or claude-sonnet-5-5" required style="flex:1;min-width:200px"></div>
      <input name="apiKey" type="password" placeholder="API key" autocomplete="off" required style="margin-top:6px">
      <div class="row" style="margin-top:6px"><button class="primary">Use my key</button></div></form>`}`;
}

function wireSettings() {
  const save = $("#ins-save"); if (save) save.onclick = async () => { try { S.ai = { ...S.ai, ...(await api("/app/ai/instructions", "POST", { text: $("#ins").value })) }; toast("Saved"); } catch (e) { toast(e.message); } };
  const kf = $("#kf"); if (kf) kf.onsubmit = async (ev) => { ev.preventDefault(); const f = new FormData(kf); try { S.ai = { ...S.ai, ...(await api("/app/ai/key", "POST", { provider: f.get("provider"), model: f.get("model"), apiKey: f.get("apiKey") })) }; toast("Your key is set (sealed on this computer)"); renderView(); } catch (e) { toast(e.message); } };
  const rm = $("#key-rm"); if (rm) rm.onclick = async () => { S.ai = { ...S.ai, ...(await api("/app/ai/key/remove", "POST")) }; toast("Your key is removed"); renderView(); };
}

function verifyHtml() {
  const v = S.verify;
  if (!v) return `<p class="hint">Checks every block's hash, link and signature here, your head against the server's countersigned head, and the latest public anchor.</p>`;
  const line = (ok, title, detail, extra = "") => `<div class="check"><div>${ok ? "✅" : "⚠️"}</div><div><b>${title}</b><div class="hint">${esc(detail)}</div>${extra}</div></div>`;
  const repair = v.local.ok ? "" : `<button id="repair" style="margin-top:6px">Put back my last backup</button>`;
  return line(v.local.ok, "Chain on this computer", v.local.detail, repair) + line(v.server.ok, "Matches the server", v.server.detail) +
    line(v.anchor.ok, "Public anchor", v.anchor.detail, v.anchor.txHash ? `<div class="mono hint">tx ${esc(v.anchor.txHash)}</div>` : "");
}

function blockText(b) {
  if (b.kind === "genesis") return `<b>Genesis</b> · wallet <span class="mono">${short(b.body.wallet)}</span>`;
  if (b.kind === "intent" && b.body.action === "vote") return `<b>You signed: ${b.body.approve ? "approve" : "reject"} a group payment</b> <span class="hint">proposal ${esc(b.body.proposalId)}</span>`;
  if (b.kind === "intent" && b.body.action === "payee") return `<b>You signed: ${b.body.allowed ? "make payee" : "stop paying"}</b> <span class="hint">contact ${esc(b.body.friendshipId)}</span>`;
  if (b.kind === "intent" && b.body.action === "confirm_draft") return `<b>You signed: confirm deal</b> <span class="hint">preview ${esc(b.body.draftId)}</span>`;
  if (b.kind === "intent" && b.body.action === "deliver") return `<b>You signed: deliver</b> · D-${esc(b.body.dealId)} milestone ${Number(b.body.index) + 1}${b.body.fileName ? `<div class="hint">${esc(b.body.fileName)} · sha256 ${esc(String(b.body.fileSha256 || "").slice(0, 12))}…</div>` : ""}${b.body.carrier ? `<div class="hint">${esc(b.body.carrier)} ${esc(b.body.tracking || "")}</div>` : ""}`;
  if (b.kind === "intent") return `<b>You signed: ${esc(b.body.action)}</b> · D-${esc(b.body.dealId)}${["cancel", "accept"].includes(b.body.action) ? "" : ` milestone ${Number(b.body.index) + 1}`}${b.body.requestId ? ` <span class="chip">from website</span>` : ""}${b.body.reason ? `<div class="hint">${esc(b.body.reason)}</div>` : ""}`;
  const e = b.body.event;
  return e.type === "deal" ? `<b>Deal D-${esc(e.dealId)}</b> → ${esc(e.status)} <span class="hint">total ${esc(e.data.total)}</span>` : `<b>D-${esc(e.dealId)} milestone ${Number(e.index) + 1}</b> → ${esc(e.status)} <span class="hint">${esc(e.data.amount)}</span>`;
}

function go(view) { S.view = view; renderApp(); load(); }

const num = (n) => Number(n || 0).toLocaleString();
const stepTools = (x) => (x.steps || []).map((st) => st && (st.tool || st.name)).filter(Boolean);

  const list = S.chats ? S.chats.chats : null, max = S.chats ? S.chats.max : 20;
  const full = list && list.length >= max;
  return `<aside class="chats-panel"><header><b>Chats</b>${list ? `<span>${list.length}/${max}</span>` : ""}</header>
    <button class="primary" id="newchat" ${S.chatBusy || full || (!S.chatId && !(S.chatHistory || []).length) ? "disabled" : ""} title="${full ? `${max} chats max: delete one first` : "Start a new chat"}">＋ New chat</button>
    <div class="chat-list">${!S.chatId && (S.chatHistory || []).length ? `<div class="on"><button><b>New chat</b><small>Just now</small></button></div>` : ""}
    ${list ? list.map((c) => `<div class="${c.id === S.chatId ? "on" : ""}"><button data-chat="${esc(c.id)}" ${S.chatBusy ? "disabled" : ""}><b>${esc(c.title)}</b><small>${new Date(c.updatedAt).toLocaleDateString(undefined, { day: "numeric", month: "short" })}</small></button><button class="del" data-delchat="${esc(c.id)}" title="Delete this chat" ${S.chatBusy ? "disabled" : ""}>✕</button></div>`).join("") : `<div class="loading"><span class="spin"></span>Loading…</div>`}</div>

/** company: the group whose preview this is (its card under Groups); undefined follows "Acting as". */
function draftCard(d, company) {
  const co = company === undefined ? "" : ` data-company="${esc(company || "")}"`;
  const blocking = d.review && d.review.blocking;
  return `<div class="card deal"><div class="row space"><div><b>${esc(d.title)}</b> <span class="hint">${esc(d.id)}</span>
    <div class="hint">${d.side === "BUY" ? "You pay" : "You sell to"} ${esc(d.sellerLabel || d.counterparty)} · review ${esc(d.reviewHours)} h${d.paymentPlan ? " · split payment" : ""}</div></div>
    <div class="row"><span class="chip">${esc(d.status)}</span><b>${esc(d.total)} ${esc(d.symbol)}</b></div></div>
    ${(d.milestones || []).map((m, i) => `<div class="ms"><div>${i + 1}. ${esc(m.name)} · <b>${esc(m.amount)}</b>${m.deposit ? ` <span class="chip warn">deposit on signing</span>` : ""}${m.due ? ` <span class="chip">due ${esc(m.due)}</span>` : ""}<div class="hint">${esc(m.acceptance)}</div></div><div class="hint">${esc(m.delivery || (m.hasFile ? "file" : "note"))}</div></div>`).join("")}
    ${d.review ? d.review.issues.map((i) => `<div class="issue ${i.level}">${esc(i.text)}</div>`).join("") : ""}
    <div class="row" style="margin-top:10px">${["PREVIEW", "DRAFT", "FAILED"].includes(d.status) ? `<button class="primary" data-confirm="${esc(d.id)}"${co} ${blocking ? "disabled title=\"Fix the blocking points with the AI first\"" : ""}>Confirm and sign</button><button data-discard="${esc(d.id)}"${co}>Discard</button><button data-tmpl="${esc(d.id)}">Save as template</button>` : d.status === "FUNDED" ? `<span class="chip ok">confirmed</span>` : `<span class="hint">The AI still needs details: answer it in the chat.</span>`}</div></div>`;
}

/** A saved chat item from the server ({ kind: user | agent | error }) in the shape the chat draws. */
const asMsg = (x) => ({ ...x, role: x.role || (x.kind === "agent" ? "assistant" : x.kind), at: typeof x.at === "string" ? Date.parse(x.at) : x.at });

function msgHtml(x) {
  x = asMsg(x);
  if (x.role === "user") return `<div class="u-msg"><small>You · ${clock(x.at)}</small><p>${esc(x.text)}</p></div>`;
  if (x.role === "error") return `<article class="a-msg"><div class="issue block" style="margin:0">${esc(x.text)}</div></article>`;
  const tools = stepTools(x);
  const drafts = (x.steps || []).filter((st) => st && st.draft).map((st) => (S.drafts || []).find((d) => d.id === st.draft.id) || st.draft);
  const u = x.usage;
  return `<div class="a-meta">Agent · ${clock(x.at)}</div>
    ${tools.length ? `<div class="badges">${tools.map((t) => `<span title="${esc(TOOL_LABEL[t] || t)}">${esc(t)}</span>`).join("")}</div>` : ""}
    <article class="a-msg${drafts.length ? " wide" : ""}"><div class="md">${window.renderMarkdown(x.text)}</div>${drafts.map(draftCard).join("")}
    ${u || x.model ? `<div class="usage-line">${u ? `<span>${num(u.tokens)} tokens</span><span>${u.calls} model call${u.calls === 1 ? "" : "s"}</span>` : ""}${tools.length ? `<span>${tools.length} tool${tools.length === 1 ? "" : "s"}</span>` : ""}<span>${x.model ? `your key · ${esc(x.model)}` : "Kravii AI"}</span></div>` : ""}</article>`;
}

const TOOLS_ICON = `<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 2v6M15 2v6M6 8h12v4a6 6 0 0 1-12 0V8zM12 18v4"/></svg>`;
/** Tools the AI has in the chat: web search (built in) and each MCP server that is on. */
const toolsCount = () => (S.webTools && S.webTools.enabled ? 1 : 0) + ((S.mcpServers && S.mcpServers.servers) || []).filter((x) => x.enabled).length;

function toolsPopHtml() {
  const w = S.webTools, list = S.mcpServers ? S.mcpServers.servers : null, rec = S.mcpSuggest ? S.mcpSuggest.recommended.filter((x) => !x.installed).slice(0, 3) : [];
  return `<header><b>Tools for the AI</b><button type="button" class="linkbtn" data-tools-close>Close</button></header>
    <section><div class="trow"><div><b>🌐 Web search</b><small>Search the web and read pages, on this computer (DuckDuckGo, no key).</small></div><input type="checkbox" data-web="enabled" ${w && w.enabled ? "checked" : ""}></div>
      ${w && w.enabled ? `<label class="tsub"><input type="checkbox" data-web="ask" ${w.ask ? "checked" : ""}> Ask me before each search</label>` : ""}</section>
    <section><h4>Your MCP servers</h4>${list ? (list.length ? list.map((x) => `<div class="trow"><div><b>${esc(x.name)}</b><small>${x.error ? `<span class="out">${esc(x.error.slice(0, 80))}</span>` : x.starting ? "starting…" : x.enabled ? `${x.tools.length} tool${x.tools.length === 1 ? "" : "s"}${x.ask ? " · asks first" : " · always allowed"}` : "off"}</small></div><input type="checkbox" data-srv="${esc(x.name)}" ${x.enabled ? "checked" : ""}></div>`).join("") : `<p class="hint">None yet.</p>`) : `<div class="loading"><span class="spin"></span>Loading…</div>`}</section>
    ${rec.length ? `<section><h4>Recommended</h4>${rec.map((x) => `<div class="trow"><div><b>${esc(x.title)}</b><small>${esc(x.description)}</small></div><button type="button" data-rec="${esc(x.id)}">Add</button></div>`).join("")}</section>` : ""}
    <button type="button" class="primary" data-go-mcp style="width:100%">Find and add MCP servers →</button>`;
}

function paintTools() {
  const n = $("#tools-n"); if (n) n.textContent = toolsCount() || "";
  const pop = $("#tools-pop");
  if (!pop || pop.hidden) return;
  pop.innerHTML = toolsPopHtml();
  pop.querySelector("[data-tools-close]").onclick = () => { pop.hidden = true; };
  pop.querySelector("[data-go-mcp]").onclick = () => go("mcp");
  pop.querySelectorAll("[data-web]").forEach((b) => (b.onchange = async () => { try { S.webTools = await api("/app/web-tools", "POST", { [b.dataset.web]: b.checked }); paintTools(); } catch (e) { toast(e.message); } }));
  pop.querySelectorAll("[data-srv]").forEach((b) => (b.onchange = async () => { b.disabled = true; try { S.mcpServers = await api("/app/mcp/servers/update", "POST", { name: b.dataset.srv, enabled: b.checked }); } catch (e) { toast(e.message); } paintTools(); }));
  pop.querySelectorAll("[data-rec]").forEach((b) => (b.onclick = async () => {
    if (!confirm("Add this MCP server? It runs on this computer (or is reached over the internet) and the app asks you before each call.")) return;
    busy(b, "…");
    try { S.mcpServers = await api("/app/mcp/servers/install", "POST", { id: b.dataset.rec }); S.mcpSuggest = null; toast("Server added"); loadSuggest(""); } catch (e) { toast(e.message); }
    paintTools();
  }));
}

async function loadSuggest(q) {
  try { S.mcpSuggest = await api(`/app/mcp/suggest?q=${encodeURIComponent(q || "")}`); } catch (e) { S.mcpSuggest = { recommended: [], results: [], error: e.message }; }
  S.mcpQ = q || "";
  if (S.view === "chat") paintTools(); else if (S.view === "mcp") renderView();
}

function railHtml() {
  const h = S.chatHistory || [];
  const replies = h.filter((x) => x.role === "assistant");
  const chatTokens = replies.reduce((n, x) => n + ((x.usage && x.usage.tokens) || 0), 0);
  const calls = replies.reduce((n, x) => n + ((x.usage && x.usage.calls) || 0), 0);
  const counts = {};
  replies.forEach((x) => stepTools(x).forEach((t) => (counts[t] = (counts[t] || 0) + 1)));
  const tools = Object.entries(counts).sort((a, b) => b[1] - a[1]);
  const u = S.ai && S.ai.usage;
  const bar = (label, used, limit) => { const pct = limit > 0 ? Math.min(100, Math.round((used / limit) * 100)) : 100; return `<div class="kv"><span>${label}</span><span>${num(used)} / ${num(limit)}</span></div><div class="bar"><i style="width:${pct}%;background:${pct >= 100 ? "var(--bad)" : pct >= 80 ? "var(--warn)" : "var(--accent)"}"></i></div>`; };
  const today = new Date().toDateString();
  const mcpToday = S.mcp ? S.mcp.log.filter((c) => new Date(c.at).toDateString() === today) : [];
  const mcpTokens = mcpToday.reduce((n, c) => n + (c.tokens || 0), 0);
  const waiting = (S.drafts || []).filter((d) => ["PREVIEW", "DRAFT", "FAILED"].includes(d.status));
  return `<aside class="rail">
    <section><h3>Tokens</h3>${u ? `${bar("Today", u.today, u.perDay)}${bar("This week", u.week, u.perWeek)}${u.ownKeyToday ? `<div class="kv"><span>Your own key today</span><span>${num(u.ownKeyToday)}</span></div>` : ""}` : `<p class="hint">Loading…</p>`}
      <div class="kv"><span>This chat</span><span>${num(chatTokens)} tokens</span></div>
      <div class="kv"><span>Replies · model calls</span><span>${replies.length} · ${calls}</span></div>
      <button class="linkbtn" data-go="ai">AI settings (own key, instructions) →</button></section>
    <section><h3>Tools used in this chat</h3>${tools.length ? tools.map(([t, n]) => `<div class="kv"><span title="${esc(t)}">${esc(TOOL_LABEL[t] || t)}</span><span>×${n}</span></div>`).join("") : `<p class="hint" style="margin:0">None yet.</p>`}</section>
    <section><h3>MCP: outside agents</h3>${S.mcp ? `<div class="kv"><span>Server</span><span>${S.mcp.settings.enabled ? `<span class="chip ok">on</span>` : `<span class="chip bad">off</span>`}</span></div>
      <div class="kv"><span>Calls today</span><span>${mcpToday.length}</span></div><div class="kv"><span>Tokens today (ask_wallet_ai)</span><span>${num(mcpTokens)}</span></div>
      ${mcpToday.slice(0, 4).map((c) => `<div class="kv"><span>${esc(c.tool)} · ${esc(c.client)}</span><span class="hint">${clock(c.at)}</span></div>`).join("")}` : `<p class="hint">Loading…</p>`}
      <button class="linkbtn" data-go="mcp">Manage the MCP server →</button></section>
    <section><h3>What the agent can do</h3>${TIERS.map((t, i) => `<div class="tier"><b>Tier ${i}</b><span>${esc(t)}</span></div>`).join("")}</section>
    <section><h3>Previews waiting</h3>${waiting.length ? waiting.slice(0, 5).map((d) => `<div class="kv"><span title="${esc(d.title)}">${esc(d.title)}</span><button class="linkbtn" data-confirm="${esc(d.id)}">Confirm</button></div>`).join("") : `<p class="hint" style="margin:0">None.</p>`}</section>
  </aside>`;
}

async function fileToAttachment(f) {
  if (f.size > 3 * 1024 * 1024) throw new Error("Attach up to 3 MB");
  const b64 = async () => { const buf = new Uint8Array(await f.arrayBuffer()); let s = ""; for (let i = 0; i < buf.length; i += 0x8000) s += String.fromCharCode.apply(null, buf.subarray(i, i + 0x8000)); return btoa(s); };
  if (f.type === "application/pdf" || /\.pdf$/i.test(f.name)) return { kind: "pdf", name: f.name, base64: await b64() };
  if (/^image\/(png|jpeg|webp|gif)$/.test(f.type)) return { kind: "image", name: f.name, mediaType: f.type, base64: await b64() };
  return { kind: "text", name: f.name, text: (await f.text()).slice(0, 60000) };
}

/** Streams one chat request (a new message, or the continuation after the user answered about MCP tools). */
async function streamChat(payload) {
  const res = await fetch("/app/chat", { method: "POST", headers: { "x-app-token": TOKEN, "content-type": "application/json" }, body: JSON.stringify(payload) });
  if (!res.ok || !res.body) throw new Error((await res.json().catch(() => ({}))).error || `The app answered ${res.status}`);
  const reader = res.body.getReader(), dec = new TextDecoder();
  let buf = "", outcome = null;
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    let cut;
    while ((cut = buf.indexOf("\n\n")) >= 0) {
      const chunk = buf.slice(0, cut); buf = buf.slice(cut + 2);
      const ev = (/^event: (.*)$/m.exec(chunk) || [])[1], raw = (/^data: (.*)$/m.exec(chunk) || [])[1];
      if (!ev || !raw) continue;
      const d = JSON.parse(raw), L = S.live;
      if (ev === "chat" && d.id) rememberChat(d.id);
      else if (ev === "turn") L.text = "";
      else if (ev === "text") L.text += d.delta;
      else if (ev === "tool") { if (!/^mcp__/.test(d.name)) L.running.push(d.name); }
      else if (ev === "step") { const t = d.step && d.step.tool; L.running = L.running.filter((x) => x !== t); if (t) L.steps.push(t); }
      else if (ev === "mcp") { const i = L.mcp.findIndex((x) => x.id === d.id); if (i >= 0) L.mcp[i] = d; else L.mcp.push(d); }
      else if (ev === "done") { outcome = { done: d }; if (d.chatId) rememberChat(d.chatId); }
      else if (ev === "approve") outcome = { approve: d };
      else if (ev === "error") outcome = { error: d.error };
      paintLive();
    }
  }
  return outcome || { error: "The reply stopped before it finished" };
}

async function sendChat(fd) {
  const message = String(fd.get("m") || "").trim();
  const f = fd.get("f");
  if (!message && !(f && f.size) || S.chatBusy) return;
  let attachment;
  try { attachment = f && f.size ? await fileToAttachment(f) : undefined; } catch (e) { toast(e.message); return; }
  S.chatHistory = [...(S.chatHistory || []), { role: "user", text: message || `📎 ${f.name}`, at: Date.now() }];
  S.chatBusy = true; S.chatDraft = ""; S.live = { text: "", steps: [], running: [], mcp: [] }; renderView();
  let out;
  try {
    out = await streamChat({ chatId: S.chatId, message: message || `Read the attached ${f.name}`, lang: S.lang || "th", attachment });
    // A chat deleted elsewhere (or remembered from another account): start a new one with the same message.
    if (out.error === "Chat not found" && S.chatId) { rememberChat(null); out = await streamChat({ chatId: null, message: message || `Read the attached ${f.name}`, lang: S.lang || "th", attachment }); }
    // Tools of the user's MCP servers that need asking: ask, then continue the same reply.
    for (let i = 0; out.approve && i < 6; i++) {
      const allow = await approveDialog(out.approve);
      out = await streamChat({ chatId: out.approve.chatId || S.chatId, lang: S.lang || "th", resume: { state: out.approve.state, calls: out.approve.calls, allow } });
    }
  } catch (e) { out = { error: e.message }; }
  S.chatBusy = false;
  const [h, d, c, ai] = await Promise.all([
    S.chatId ? api(`/app/chat?id=${encodeURIComponent(S.chatId)}`).then((x) => x.messages.map(asMsg)).catch(() => null) : Promise.resolve(null),
    api("/app/drafts").catch(() => ({ drafts: S.drafts || [] })), api("/app/chats").catch(() => S.chats), api("/app/ai").catch(() => S.ai),
  ]);
  // A reply that failed was not saved: keep the message on screen with the error under it.
  S.chatHistory = out.error || !h ? [...S.chatHistory, ...(out.error ? [{ role: "error", text: out.error, at: Date.now() }] : [])] : h;
  S.drafts = d.drafts; S.chats = c; S.ai = ai; S.live = null;
  if (S.view === "chat") renderView();
}

const fmtDay = (x) => new Date(`${x}T12:00:00`).toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" });
function dueLeft(x) { const n = Math.ceil((new Date(`${x}T23:59:59+07:00`).getTime() - Date.now()) / 86400000); return n > 1 ? `in ${n} days` : n === 1 ? "tomorrow" : n === 0 ? "today" : `late by ${-n} day${n === -1 ? "" : "s"}`; }
/** A milestone's due date (agreed by both sides): countdown, propose / accept, late refund request. */
function dueHtml(d, m) {
  const u = m.due;
  if (!u || m.delivery === "deposit") return "";
  const editable = d.status !== "Cancelled" && m.status === "Pending";
  const today = new Date(Date.now() + 7 * 3600000).toISOString().slice(0, 10);
  return `<div class="hint" style="margin-top:4px">Due: ${u.due ? `<span style="color:${u.late ? "var(--bad)" : "inherit"}">${esc(fmtDay(u.due))} · ${esc(dueLeft(u.due))}</span>` : "no date agreed"}
    ${u.proposedDue && u.proposedBy === "them" ? ` · they propose ${esc(fmtDay(u.proposedDue))} ${editable ? `<button class="primary" data-due="accept" data-deal="${d.id}" data-i="${m.index}" style="padding:2px 8px;font-size:11px">Accept</button>` : ""}` : ""}
    ${u.proposedDue && u.proposedBy === "me" ? ` · you proposed ${esc(fmtDay(u.proposedDue))} (waiting)` : ""}
    ${editable ? ` <input type="date" min="${today}" data-due-date="${d.id}-${m.index}" style="width:auto;padding:2px 6px;font-size:11px"> <button data-due="propose" data-deal="${d.id}" data-i="${m.index}" style="padding:2px 8px;font-size:11px">${u.due ? "Propose another date" : "Propose a due date"}</button>` : ""}
    ${u.late && d.role === "buyer" && !u.lateRequestedAt ? ` <button class="danger" data-due="late" data-deal="${d.id}" data-i="${m.index}" style="padding:2px 8px;font-size:11px">Ask for a refund (late)</button>` : ""}
    ${u.lateRequestedAt ? `<div style="color:var(--bad)">${d.role === "buyer" ? "You asked for a refund" : "The buyer asks for a refund: nothing was delivered by the agreed date"} (${esc(new Date(u.lateRequestedAt).toLocaleDateString())})</div>` : ""}</div>`;
}

const STATUS_CHIP = { Released: "ok", Approved: "ok", KeyReleased: "ok", Active: "ok", Disputed: "bad", Refunded: "warn", Cancelled: "warn", Delivered: "warn", Split: "warn" };
function dealHtml(d) {
  const now = Date.now() / 1000;
  const btn = (action, index, label, cls = "") => `<button class="${cls}" data-act="${action}" data-deal="${d.id}" data-i="${index}">${label}</button>`;
  const head = [];
  if (d.status === "Proposed") {
    if (d.offeredBy === "them") head.push(btn("accept", 0, d.role === "buyer" ? "Accept and pay" : "Accept the offer", "primary"));
    else head.push(btn("cancel", 0, "Cancel my offer", "danger"));
  }
  return `<div class="card deal"><div class="row space"><div><b>${esc(d.title)}</b> <span class="hint">D-${d.id}</span>
      <div class="hint">${d.role === "buyer" ? "You buy from" : "You sell to"} ${esc(d.counterpartyLabel)} ${d.counterpartyHasApp ? `<span class="chip ok">their app links to your chain</span>` : ""}</div></div>
      <div class="row"><span class="chip ${STATUS_CHIP[d.status] || ""}">${esc(d.status)}</span><b>${esc(d.total)}</b>${head.join("")}<button data-details="${d.id}">${S.dealOpen && S.dealOpen[d.id] ? "Hide details" : "Details"}</button></div></div>
    ${d.milestones.map((m) => {
      const acts = [];
      if (d.status === "Active") {
        if (d.role === "buyer" && (m.status === "Delivered" || m.status === "KeyReleased")) { acts.push(btn("approve", m.index, "Approve and pay", "primary")); if (m.status === "Delivered") acts.push(`<button data-changes="${d.id}" data-i="${m.index}">Ask for changes</button>`); }
        if (d.role === "buyer" && m.status === "Pending" && m.deadline && m.deadline < now) acts.push(btn("reclaim", m.index, "Reclaim (late)"));
        if (d.role === "seller" && m.status === "Delivered" && m.deadline && m.deadline < now) acts.push(btn("claim", m.index, "Claim payment", "primary"));
        if (d.role === "seller" && m.status === "Pending" && m.delivery !== "deposit") acts.push(`<button class="primary" data-deliver="${d.id}" data-i="${m.index}">Deliver</button>`);
        if (d.role === "seller" && ["Pending", "Delivered", "Disputed"].includes(m.status)) acts.push(btn("refund", m.index, "Refund buyer", "danger"));
      }
      return `<div class="ms"><div>${esc(m.name)} · <b>${esc(m.amount)}</b> <span class="chip ${STATUS_CHIP[m.status] || ""}">${esc(m.status)}</span> <span class="hint">${esc(m.delivery || "")}</span>${dueHtml(d, m)}${m.split ? `<span class="hint"> seller ${esc(m.split.toSeller)} / buyer ${esc(m.split.toBuyer)}</span>` : ""}${m.file ? `<div class="hint">📎 ${esc(m.file.name)}</div>` : ""}</div><div class="row">${m.file && m.file.preview ? `<button data-preview="${d.id}" data-i="${m.index}" data-name="${esc(m.file.name)}">Preview</button>` : ""}${acts.join("")}</div></div>`;
    }).join("")}
    ${S.dealOpen && S.dealOpen[d.id] ? dealDetailHtml(d.id) : ""}
  </div>`;
}

    if (S.view === "deals") { const [d, p] = await Promise.all([api("/app/deals"), api("/app/drafts").catch(() => ({ drafts: [] }))]); S.deals = d.deals; S.drafts = p.drafts; }
    if (S.view === "chain") S.chain = await api("/app/chain");

      if (S.chatId === undefined) { try { S.chatId = localStorage.getItem("awchat"); } catch { S.chatId = null; } }
      const [c, d, ai, mcp, wt] = await Promise.all([api("/app/chats"), api("/app/drafts"), api("/app/ai").catch(() => null), api("/app/mcp").catch(() => null), api("/app/web-tools").catch(() => null)]);
      S.chats = c; S.drafts = d.drafts; S.ai = ai; S.mcp = mcp; S.webTools = wt;
      if (S.mcpServers == null) api("/app/mcp/servers").then((v) => { S.mcpServers = v; if (S.view === "chat" && !S.chatBusy) paintTools(); }).catch(() => undefined);
      if (S.chatId && !c.chats.some((x) => x.id === S.chatId)) rememberChat(null);
      if (!S.chatBusy) S.chatHistory = S.chatId ? (await api(`/app/chat?id=${encodeURIComponent(S.chatId)}`).catch(() => ({ messages: [] }))).messages.map(asMsg) : (S.chatHistory || []).filter(() => !S.chatId);
    }
    if (S.view === "activity") { const [a, t] = await Promise.all([api("/app/activity"), api("/app/topup").catch(() => null)]); S.activity = a; S.topup = t; }
    if (S.view === "contacts" || S.view === "groups") { const f = await api("/app/friends"); S.friends = f.friends; S.friendsMe = f.me; }
    if (S.view === "links") S.links = (await api("/app/invite-links")).links;
    if (S.view === "ai") S.ai = await api("/app/ai").catch(() => null);
    if (S.view === "mcp") { S.mcp = await api("/app/mcp"); if (S.mcpServers == null) api("/app/mcp/servers").then((v) => { S.mcpServers = v; if (S.view === "mcp") renderView(); }).catch((e) => toast(e.message)); }
    if (S.view === "groups") { S.groups = await api("/app/groups"); S.actingGroups = S.groups.groups; }
    if (EXTRA_VIEWS[S.view]) await EXTRA_VIEWS[S.view].load().catch((e) => toast(e.message));
    if (!S.headerAt || Date.now() - S.headerAt > 60_000) { S.headerAt = Date.now(); loadHeader().then(() => { if (S.info.stage === "ready") { const h = $("#hdr"); if (h) { h.innerHTML = headerHtml(); wireHeader(); } } }).catch(() => undefined); }
  } catch (e) { toast(e.message); }
  if (S.info.stage === "ready") renderApp(); else render();
}
// The money view refreshes when the browser comes back from a Stripe payment.
window.addEventListener("focus", () => { if (S.info && S.info.stage === "ready" && S.view === "activity") load(); });

setInterval(async () => {
  if (!S.info || S.info.stage !== "ready" || S.chatBusy || document.querySelector("dialog[open]") || document.querySelector("#cf textarea")?.value) return;
  const before = JSON.stringify([S.info.height, (S.info.requests || []).length, (S.info.agentRequests || []).length]);
  try { S.info = await api("/app/state"); } catch { return; }
  if (JSON.stringify([S.info.height, (S.info.requests || []).length, (S.info.agentRequests || []).length]) !== before) load();
}, 10_000);

boot().then(load).catch((e) => { $("#root").innerHTML = `<div class="center"><div class="card narrow err" style="display:block">${esc(e.message)}</div></div>`; });
</script>
