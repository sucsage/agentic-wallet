# Production on one server: the web app and its own Postgres. Not the local test stack (that is docker-compose.yml).
#   cp .env.prod.example .env.prod      fill it in (see the comments), then:
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
# The chain is NOT started here: point RPC_URL and the *_ADDRESS values at the existing one (the Besu
# chain server, or Base Sepolia). The database lives in the `pgdata` volume and survives `down`;
# `down -v` deletes it.
name: agentic-wallet-prod

x-env: &env
  env_file: .env.prod

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aw}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}
      POSTGRES_DB: ${POSTGRES_DB:-agenticwallet}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No published port: only the web container reaches it. Use `docker compose exec postgres psql` to inspect.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    <<: *env
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      # Built from the same three values as the database, so the password lives in one place.
      DATABASE_URL: postgresql://${POSTGRES_USER:-aw}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-agenticwallet}
      DIRECT_URL: postgresql://${POSTGRES_USER:-aw}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-agenticwallet}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?set BETTER_AUTH_URL (the public https address) in .env.prod}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env.prod}
      RPC_URL: ${RPC_URL:?set RPC_URL in .env.prod}
    # Behind your reverse proxy or tunnel (TLS there). Loopback only, so nothing reaches the app unproxied.
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:3000/api/auth/ok"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  # What Vercel's cron does in the hosted setup (vercel.json): daily, withdraw lapsed offers and
  # anchor the desktop apps' chain heads on the chain.
  cron:
    image: curlimages/curl:8.11.1
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    environment:
      CRON_SECRET: ${CRON_SECRET:?set CRON_SECRET in .env.prod}
    entrypoint: ["sh", "-c", "while true; do curl -s -m 280 -H \"Authorization: Bearer $$CRON_SECRET\" http://web:3000/api/cron/offers || echo cron call failed; sleep 86400; done"]

volumes:
  pgdata:
