# MilestonePay desktop (the app in its own window): installers for macOS, Windows and Linux, published as a GitHub Release.
# Runs when a tag desktop-v<version> is pushed (the version must match desktop/package.json).
# The app's updater and the website's /download page read the release's latest.json.
name: Desktop release

on:
  push:
    tags: ["desktop-v*"]

permissions:
  contents: read

defaults:
  run:
    working-directory: desktop
    shell: bash

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "1.4.3" }
      - run: bun install --frozen-lockfile
      # The block format is shared with the website (web/src/lib/device-chain/format.ts): give it viem.
      - run: mkdir -p ../web/node_modules && cp -R node_modules/. ../web/node_modules/
      - run: bun test

  # The app in its own window (Electrobun, desktop/electrobun): the only build since 0.5.0 (the
  # browser build is gone). Built on each platform; a platform that fails is left out of the release
  # instead of stopping it.
  window:
    needs: [test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, name: macos-arm64 }
          - { os: macos-15-intel, name: macos-x64 }
          - { os: windows-2022, name: windows-x64 }
          - { os: ubuntu-24.04, name: linux-x64 }
          - { os: ubuntu-24.04-arm, name: linux-arm64 }
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "1.4.3" }
      - if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q libwebkit2gtk-4.1-0 libgtk-3-0 libayatana-appindicator3-1
      - run: bun install --frozen-lockfile
      - run: mkdir -p ../web/node_modules && cp -R node_modules/. ../web/node_modules/
      - name: Build the windowed app
        working-directory: desktop/electrobun
        run: |
          bun install --frozen-lockfile
          bunx electrobun build --env=stable
      - name: Name the installers
        working-directory: desktop/electrobun
        run: |
          V=${GITHUB_REF_NAME#desktop-v}
          mkdir -p out
          for f in artifacts/*; do
            case "$f" in *update.json|*.tar.zst) continue ;; esac
            base=$(basename "$f"); rest="${base#*MilestonePay}"
            name="MilestonePay-$V-window-${{ matrix.name }}"
            case "$rest" in .*) out="$name$rest" ;; -*) out="$name$rest" ;; *) out="$name-$rest" ;; esac
            cp "$f" "out/$out"
          done
          ls -la out
      - uses: actions/upload-artifact@v4
        with: { name: "window-${{ matrix.name }}", path: "desktop/electrobun/out/*", if-no-files-found: error }

  release:
    needs: [test, window]
    if: ${{ always() && needs.test.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "1.4.3" }
      - uses: actions/download-artifact@v4
        with: { path: desktop/dist, merge-multiple: true }
      - name: Check the version
        run: |
          V=${GITHUB_REF_NAME#desktop-v}
          test "$V" = "$(bun -e 'console.log((await Bun.file("package.json").json()).version)')" || { echo "Tag $V does not match package.json"; exit 1; }
      - run: bun run scripts/release-manifest.ts "${GITHUB_REF_NAME#desktop-v}" "release-notes/${GITHUB_REF_NAME#desktop-v}.md"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=${GITHUB_REF_NAME#desktop-v}
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "MilestonePay Desktop $V (test mode demo)" --notes-file "release-notes/$V.md" --latest
