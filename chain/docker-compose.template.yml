# Agentic Wallet private chain: Hyperledger Besu, QBFT, chainId 20261020.
#  - Closed: the RPC listens on 127.0.0.1 only; the web server is its only client.
#  - Only the server's own keys may send transactions (permissions_config.toml).
#  - Gas is free (zero base fee, min gas price 0); there is no coin to buy or trade.
# Admins (reviewers) inspect transactions in the app's admin explorer, not on this RPC.
#
#   docker compose up -d        # start      docker compose down       # stop (keeps the chain)
#   docker compose down -v      # wipe the chain
#
# Demo: one validator to fit a laptop. Production: one validator per bank (4+ for QBFT fault tolerance).
services:
  validator1:
    image: hyperledger/besu:24.12.2
    restart: unless-stopped
    command:
      - --genesis-file=/cfg/network/genesis.json
      - --node-private-key-file=/cfg/network/keys/__VALIDATOR__/key
      - --data-path=/data
      - --rpc-http-enabled
      - --rpc-http-host=0.0.0.0
      - --rpc-http-api=ETH,NET,WEB3
      - --host-allowlist=*
      - --min-gas-price=0
      - --permissions-accounts-config-file-enabled
      - --permissions-accounts-config-file=/cfg/permissions_config.toml
      - --p2p-host=127.0.0.1
    environment:
      JAVA_OPTS: -Xmx768m
    volumes:
      - ./:/cfg
      - besu-data:/data
    ports:
      # Loopback only: nothing outside this machine can reach the chain.
      - "127.0.0.1:8555:8545"
volumes:
  besu-data:
